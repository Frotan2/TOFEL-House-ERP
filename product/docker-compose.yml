# TOEFL House ERP — one-click desktop product runtime.
#
# Service images are the reviewed, digest-pinned MariaDB/Redis from
# docs/engineering/foundation-version-matrix.json (guarded by
# tests/foundation/test_product_packaging.py so they can never silently drift).
# The application image is built locally from pinned upstream commits plus the
# owned apps (product/app.Dockerfile); nothing is pulled from an unreviewed tag.
#
# Desktop profile: loopback-only exposure on the Windows host (127.0.0.1).
# Multi-user access (owner decision D13: central server + Tailscale) does not
# open any other interface: authorized staff PCs reach the ERP through their
# Tailscale tailnet, where Tailscale Serve on the central PC terminates TLS
# and proxies to 127.0.0.1:8000 (tailnet-only; no Funnel, no public
# exposure). Exact setup: docs/engineering/LAUNCH-RUNBOOK.md, section
# "Multi-user access (central server + Tailscale)".
name: toefl-house-erp

services:
  bootstrap:
    image: toefl-house-erp-app:local
    container_name: toefl-house-erp-bootstrap
    user: root
    depends_on:
      db:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    # The one-shot initializer alone can read the MariaDB root password.
    # Web/worker/scheduler/socketio never receive db.env or the DB root secret.
    # Runs as root only to chown Windows bind mounts; drops to frappe inside
    # the entrypoint before any bench/gunicorn work.
    entrypoint: ["/product/entrypoint.sh", "bootstrap"]
    volumes:
      - ./data/sites:/home/frappe/bench/sites
      - ./data/logs:/home/frappe/bench/logs
      - type: bind
        source: ./data/secrets/db.env
        target: /run/bootstrap-secrets/db.env
        read_only: true
        bind:
          create_host_path: false
    restart: "no"

  web:
    build:
      context: ..
      dockerfile: product/app.Dockerfile
      # Node tarball integrity (docs/engineering/foundation-version-matrix.json,
      # node.tarball_sha256): the build verifies the download's sha256.
      args:
        NODE_TARBALL_SHA256: "fd8e59d5a511510f6a298afb548f18c7d2b1be404d8b4a27d94fbe49f56cb2d6"
    image: toefl-house-erp-app:local
    container_name: toefl-house-erp-web
    user: root
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    # The bootstrap service completes all privileged initialization before the
    # web process starts; this long-lived service never sees the DB root file.
    # Runs as root only to chown Windows bind mounts; drops to frappe inside
    # the entrypoint before any bench/gunicorn work.
    entrypoint: ["/product/entrypoint.sh", "web"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data/sites:/home/frappe/bench/sites
      - ./data/logs:/home/frappe/bench/logs
      # The activation receipt contains verification evidence, not credentials;
      # DB secrets stay in bootstrap-only ./data/secrets and are never mounted.
      - ./data/activation:/run/activation:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/"]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 25m
    restart: unless-stopped

  worker:
    image: toefl-house-erp-app:local
    container_name: toefl-house-erp-worker
    user: root
    # Start only after web is healthy (bootstrap and migrations have completed);
    # unless-stopped also recovers the worker after transient service failures.
    depends_on:
      web:
        condition: service_healthy
      db:
        condition: service_healthy
    # Runs as root only to chown Windows bind mounts; drops to frappe inside
    # the entrypoint before any bench work. The full bench command is baked
    # into the entrypoint; no compose command override is needed.
    entrypoint: ["/product/entrypoint.sh", "worker"]
    working_dir: /home/frappe/bench
    volumes:
      - ./data/sites:/home/frappe/bench/sites
      - ./data/logs:/home/frappe/bench/logs
    restart: unless-stopped

  scheduler:
    image: toefl-house-erp-app:local
    container_name: toefl-house-erp-scheduler
    user: root
    depends_on:
      web:
        condition: service_healthy
      db:
        condition: service_healthy
    # Runs as root only to chown Windows bind mounts; drops to frappe inside
    # the entrypoint before any bench work.
    entrypoint: ["/product/entrypoint.sh", "scheduler"]
    working_dir: /home/frappe/bench
    volumes:
      - ./data/sites:/home/frappe/bench/sites
      - ./data/logs:/home/frappe/bench/logs
    restart: unless-stopped

  socketio:
    image: toefl-house-erp-app:local
    container_name: toefl-house-erp-socketio
    user: root
    depends_on:
      web:
        condition: service_healthy
      db:
        condition: service_healthy
    # Runs as root only to chown Windows bind mounts; drops to frappe inside
    # the entrypoint before any node work.
    entrypoint: ["/product/entrypoint.sh", "socketio"]
    working_dir: /home/frappe/bench
    ports:
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/socket.io/?EIO=4&transport=polling"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - ./data/sites:/home/frappe/bench/sites
      - ./data/logs:/home/frappe/bench/logs
    restart: unless-stopped

  db:
    # Digest pinned: MariaDB 11.8.9 (see foundation-version-matrix.json).
    image: mariadb@sha256:2d2f4095530294735a857cfe22bb101e19b0849b416911c796ec4aa81b164a62
    container_name: toefl-house-erp-db
    env_file:
      - ./data/secrets/db.env
    environment:
      MARIADB_ROOT_HOST: "%"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis-queue:
    # Digest pinned: Redis 8.6.6 (see foundation-version-matrix.json).
    image: redis@sha256:75934ddb37bfaebe3b4082ba673cac39f66495244134f33dd0a502ce03cdcd36
    container_name: toefl-house-erp-redis-queue
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  redis-cache:
    image: redis@sha256:75934ddb37bfaebe3b4082ba673cac39f66495244134f33dd0a502ce03cdcd36
    container_name: toefl-house-erp-redis-cache
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  db-data:
