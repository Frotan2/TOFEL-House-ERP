[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "toefl_house"
version = "0.1.0"
description = "TOEFL House placement, admission, enrollment, teaching and finance commands"
requires-python = ">=3.14"

[tool.setuptools.package-data]
toefl_house = [
  "modules.txt", "patches.txt", "fixtures/*.json",
  "*/doctype/*/*.json", "*/report/*/*.json", "*/workspace/*/*.json",
  "*/page/*/*.json", "public/js/*.js", "public/css/*.css"
]

[tool.setuptools.packages.find]
include = ["toefl_house*"]
