[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "foundation_security"
version = "0.2.1"
description = "Generic Frappe session and Student permission safeguards"
requires-python = ">=3.14"

[tool.setuptools.package-data]
foundation_security = ["modules.txt", "patches.txt"]

[tool.setuptools.packages.find]
include = ["foundation_security*"]
