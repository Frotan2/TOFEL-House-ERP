name: Windows customer package smoke

on:
  push:
    paths:
      - "TOEFL House ERP.vbs"
      - docs/engineering/FINAL-HOSTED-ACCEPTANCE-2026-10-23.md
      - "product/windows/**"
      - "tests/foundation/test_customer_install_package.py"
      - ".github/workflows/windows-customer-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  customer-package:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Parse all customer PowerShell launchers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            'product/windows/TOEFL House ERP.ps1',
            'product/windows/Run TOEFL House ERP.ps1',
            'product/windows/Check This PC.ps1',
            'product/windows/Verify Package Image.ps1',
            'product/windows/Prepare Customer Package.ps1',
            'product/windows/Test Fresh Installation.ps1'
          )
          foreach ($path in $paths) {
            $tokens = $null
            $problems = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE $path), [ref]$tokens, [ref]$problems)
            if ($problems.Count -gt 0) {
              throw ("PowerShell syntax error in " + $path + ": " + ($problems | Out-String))
            }
          }
          Write-Host "Customer PowerShell scripts parsed successfully."
      - name: Initialize Windows GUI without opening a desktop window
        shell: powershell
        run: |
          & powershell.exe -NoLogo -NoProfile -STA -ExecutionPolicy Bypass -File 'product/windows/TOEFL House ERP.ps1' -SmokeTest
          if ($LASTEXITCODE -ne 0) { throw "Windows GUI initialization failed." }
      - name: Exercise clean offline package with a synthetic image
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $fakeDir = Join-Path $env:RUNNER_TEMP "Fake Docker"
          New-Item -ItemType Directory -Path $fakeDir -Force | Out-Null
          # A real .exe is required: invoking a .cmd from another .cmd without
          # CALL transfers control out of the parent and is not a valid Docker mock.
          $fakeDocker = @'
          using System;
          using System.IO;
          public class FakeDocker {
              public static int Main(string[] args) {
                  if (args.Length == 0) return 1;
                  if (args[0] == "info") return 0;
                  if (args[0] == "volume") return 0;
                  if (args[0] == "load") return 0;
                  if (args[0] == "compose") return 0;
                  if (args[0] == "image") {
                      Console.WriteLine("{\"org.toefl-house.source-eol\":\"lf-v1\"}");
                      return 0;
                  }
                  if (args[0] == "save" && args.Length >= 3) {
                      File.WriteAllText(args[2], "SYNTHETIC_IMAGE_FOR_TESTING");
                      return 0;
                  }
                  if (args[0] == "inspect") {
                      Console.WriteLine(args.Length >= 3 && args[2].Contains("State.Status")
                          ? "running" : "healthy");
                      return 0;
                  }
                  return 1;
              }
          }
          '@
          Add-Type -TypeDefinition $fakeDocker -OutputAssembly (Join-Path $fakeDir 'docker.exe') -OutputType ConsoleApplication
          $env:PATH = "$fakeDir;$env:PATH"
          $target = Join-Path $env:RUNNER_TEMP "Customer Kits"
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "product/windows/Prepare Customer Package.ps1" -Destination $target
          if ($LASTEXITCODE -ne 0) { throw "Synthetic package creation failed." }
          $kits = @(Get-ChildItem -LiteralPath $target -Directory)
          if ($kits.Count -ne 1) { throw "Expected exactly one customer package." }
          $kit = $kits[0].FullName
          foreach ($relative in @(
            'TOEFL House ERP.vbs',
            'product/docker-compose.yml',
            'product/windows/TOEFL House ERP.ps1',
            'product/windows/Check This PC.ps1',
            'product/windows/OWNER ACCEPTANCE GUIDE.txt',
            'product/release/toefl-house-erp-app.tar',
            'product/release/toefl-house-erp-app.tar.sha256',
            'READ ME FIRST.txt'
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $kit $relative) -PathType Leaf)) {
              throw "Package missing $relative"
            }
          }
          if (Test-Path -LiteralPath (Join-Path $kit 'product/data')) {
            throw "Customer package included private application data."
          }
          $ownerGuide = [System.IO.File]::ReadAllText((Join-Path $kit 'product/windows/OWNER ACCEPTANCE GUIDE.txt'))
          if ($ownerGuide -notmatch 'RELEASE DECISION: NO-GO' -or $ownerGuide -notmatch 'PRESERVATION') {
            throw "Customer kit omitted its Owner hold and safe first-check guidance."
          }
          # A corrupt first-run kit must be rejected before creating local data.
          # Use a separate synthetic copy so the valid package stays unchanged.
          $damagedKit = Join-Path $env:RUNNER_TEMP "Damaged Customer Kit"
          Copy-Item -LiteralPath $kit -Destination $damagedKit -Recurse -ErrorAction Stop
          $damagedArchive = Join-Path $damagedKit 'product/release/toefl-house-erp-app.tar'
          [System.IO.File]::AppendAllText($damagedArchive, "SYNTHETIC_CORRUPTION")
          $env:TH_GUI_MODE = '1'
          $damagedInstall = Join-Path $damagedKit 'product/windows/Install TOEFL House ERP.cmd'
          # A correctly rejected package emits stderr. Windows PowerShell
          # 5.1 wraps native stderr in a NativeCommandError when the CI
          # preference is Stop. Capture the EXPECTED refusal, then restore Stop.
          $previousPreference = $ErrorActionPreference
          try {
            $ErrorActionPreference = 'Continue'
            $rejectedOutput = @(& $damagedInstall 2>&1)
            $rejectedExit = $LASTEXITCODE
          } finally {
            $ErrorActionPreference = $previousPreference
          }
          if ($rejectedExit -eq 0) { throw "Damaged kit was accepted by installer." }
          if (Test-Path -LiteralPath (Join-Path $damagedKit 'product/data')) {
            throw "Damaged kit modified local ERP data before integrity verification."
          }
          if (($rejectedOutput -join [Environment]::NewLine) -notmatch 'Package integrity verification failed') {
            throw "Damaged kit refusal did not explain its cause."
          }
          # Check This PC must be runnable with an empty package and must
          # not create site files, secrets, Docker volumes or backups.
          if (Test-Path -LiteralPath (Join-Path $kit 'product/data')) {
            throw "Unexpected customer data before read-only PC check."
          }
          $checkScript = Join-Path $kit 'product/windows/Check This PC.ps1'
          $checkOutput = @(& powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $checkScript 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "Read-only PC check failed." }
          if (($checkOutput -join "`n") -notmatch 'Production authorization: NOT VERIFIED') {
            throw "Read-only PC check omitted release hold notice."
          }
          if (Test-Path -LiteralPath (Join-Path $kit 'product/data')) {
            throw "Read-only PC check unexpectedly changed customer data."
          }
          # Exercise the customer-facing CMD paths without real Docker or databases.
          $fakeCurl = 'public class FakeCurl { public static int Main(string[] args) { return 0; } }'
          Add-Type -TypeDefinition $fakeCurl -OutputAssembly (Join-Path $fakeDir 'curl.exe') -OutputType ConsoleApplication
          $env:TH_GUI_MODE = '1'
          foreach ($task in @('Install', 'Start', 'Stop', 'Repair')) {
            $script = Join-Path $kit ("product/windows/" + $task + " TOEFL House ERP.cmd")
            $output = @(& $script 2>&1)
            $taskExit = $LASTEXITCODE
            $stageSummary = @($output | Where-Object { $_ -match '^\[TH_STAGE\]' })
            Write-Host ("Synthetic " + $task + " exit=" + $taskExit + " stageCount=" + $stageSummary.Count)
            if ($stageSummary.Count -eq 0) {
              $safeMessages = @($output | Where-Object { $_ -match 'Docker Desktop|Windows could not|missing|failed|could not|site|install|script|data|database' } | Select-Object -First 8)
              foreach ($line in $safeMessages) { Write-Host ("Synthetic diagnostic: " + (($line -replace 'MARIADB_ROOT_PASSWORD=.*', 'MARIADB_ROOT_PASSWORD=[REDACTED]') -replace 'Password:.*', 'Password:[REDACTED]')) }
            }
            if ($taskExit -ne 0) {
              throw ("Headless " + $task + " failed: " + ($output | Out-String))
            }
            if (($output | Out-String) -match 'Username: Administrator|Password: ') {
              throw "Headless execution leaked the initial Administrator credentials."
            }
          }
          if (-not (Test-Path -LiteralPath (Join-Path $kit 'product/data/secrets/db.env') -PathType Leaf)) {
            $productData = Join-Path $kit 'product/data'
            Write-Host ("Diagnostic: kit product data directory exists=" + (Test-Path -LiteralPath $productData))
            if (Test-Path -LiteralPath $productData) {
              Get-ChildItem -LiteralPath $productData -Recurse -Force | ForEach-Object { Write-Host ("Diagnostic path: " + $_.FullName) }
            }
            throw "Headless synthetic install did not generate its local credential file."
          }
          Write-Host "Headless installer, start, stop and repair routes passed with fake Docker."
          # Simulate a lost credential file after synthetic installation. The
          # read-only check must catch it without viewing password contents.
          $credential = Join-Path $kit 'product/data/secrets/db.env'
          $heldCredential = "$credential.synthetic-hold"
          if (Test-Path -LiteralPath $heldCredential) {
            throw "Unexpected synthetic credential hold file."
          }
          Move-Item -LiteralPath $credential -Destination $heldCredential
          try {
            $blockedCheck = @(& powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $checkScript 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "Read-only missing-credential check failed." }
            if (($blockedCheck -join "`n") -notmatch 'BLOCKED: existing site/database but credential file missing') {
              throw "Read-only check failed to warn about preserved data and missing credentials."
            }
          } finally {
            Move-Item -LiteralPath $heldCredential -Destination $credential
          }
          Write-Host "Missing-credential preservation check passed."
          $tar = Join-Path $kit 'product/release/toefl-house-erp-app.tar'
          $sha = "$tar.sha256"
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File 'product/windows/Verify Package Image.ps1' -Archive $tar -Checksum $sha
          if ($LASTEXITCODE -ne 0) { throw "Valid synthetic package was rejected." }
          Add-Content -LiteralPath $tar -Value 'TAMPERED'
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File 'product/windows/Verify Package Image.ps1' -Archive $tar -Checksum $sha
          if ($LASTEXITCODE -eq 0) { throw "Tampered image was accepted." }
          Write-Host "Package allowlist, valid checksum and corruption rejection passed."
          exit 0
