name: Windows customer package smoke

on:
  push:
    paths:
      - "TOEFL House ERP.vbs"
      - docs/engineering/FINAL-HOSTED-ACCEPTANCE-2026-10-23.md
      - "product/windows/**"
      - "product/update_engine.py"
      - "product/update_entrypoint.sh"
      - "product/updates/**"
      - "tests/foundation/test_update_engine.py"
      - "tests/foundation/test_update_bundle.py"
      - "tests/foundation/test_windows_update_path.py"
      - "docs/CUSTOMER-UPDATES.md"
      - "docs/engineering/SAFE-UPDATES.md"
      - "tests/foundation/test_customer_install_package.py"
      - ".github/workflows/windows-customer-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  customer-package:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Parse all customer PowerShell launchers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            'product/windows/TOEFL House ERP.ps1',
            'product/windows/Run TOEFL House ERP.ps1',
            'product/windows/Check This PC.ps1',
            'product/windows/Verify Package Image.ps1',
            'product/windows/Prepare Customer Package.ps1',
            'product/windows/Test Fresh Installation.ps1',
            'product/windows/Test Existing Installation.ps1',
            'product/windows/Update TOEFL House ERP.ps1'
          )
          foreach ($path in $paths) {
            $tokens = $null
            $problems = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE $path), [ref]$tokens, [ref]$problems)
            if ($problems.Count -gt 0) {
              throw ("PowerShell syntax error in " + $path + ": " + ($problems | Out-String))
            }
          }
          Write-Host "Customer PowerShell scripts parsed successfully."
      - name: Prove signed Windows update workflow refuses unconfigured channel
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "product/windows/Update TOEFL House ERP.ps1" -SmokeTest
          if ($LASTEXITCODE -ne 0) { throw "Windows updater refused its fail-closed smoke." }
      - name: Initialize Windows GUI without opening a desktop window
        shell: powershell
        run: |
          & powershell.exe -NoLogo -NoProfile -STA -ExecutionPolicy Bypass -File 'product/windows/TOEFL House ERP.ps1' -SmokeTest
          if ($LASTEXITCODE -ne 0) { throw "Windows GUI initialization failed." }
      - name: Exercise clean offline package with a synthetic image
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $fakeDir = Join-Path $env:RUNNER_TEMP "Fake Docker"
          New-Item -ItemType Directory -Path $fakeDir -Force | Out-Null
          # A real .exe is required: invoking a .cmd from another .cmd without
          # CALL transfers control out of the parent and is not a valid Docker mock.
          $fakeDocker = @'
          using System;
          using System.IO;
          public class FakeDocker {
              public static int Main(string[] args) {
                  if (args.Length == 0) return 1;
                  if (args[0] == "info") return 0;
                  if (args[0] == "volume") {
                      bool present = Environment.GetEnvironmentVariable("TH_SYNTHETIC_VOLUME_EXISTS") == "1";
                      if (args.Length > 1 && args[1] == "ls") {
                          if (present) Console.WriteLine("toefl-house-erp_db-data");
                          return 0;
                      }
                      if (args.Length > 1 && args[1] == "inspect") return present ? 0 : 1;
                      return 1;
                  }
                  if (args[0] == "load") return 0;
                  if (args[0] == "compose") return 0;
                  if (args[0] == "image" && args.Length >= 3 && args[1] == "inspect") {
                      if (args[2] != "toefl-house-erp-app:local") return 1;
                      Console.WriteLine(Environment.GetEnvironmentVariable("TH_SYNTHETIC_INSPECT_JSON"));
                      return 0;
                  }
                  if (args[0] == "save" && args.Length == 4 && args[1] == "--output") {
                      if (args[3] != "toefl-house-erp-app:local") return 1;
                      File.Copy(Environment.GetEnvironmentVariable("TH_SYNTHETIC_IMAGE_ARCHIVE"), args[2]);
                      return 0;
                  }
                  if (args[0] == "inspect") {
                      Console.WriteLine(args.Length >= 3 && args[2].Contains("State.Status")
                          ? "running" : "healthy");
                      return 0;
                  }
                  return 1;
              }
          }
          '@
          Add-Type -TypeDefinition $fakeDocker -OutputAssembly (Join-Path $fakeDir 'docker.exe') -OutputType ConsoleApplication
          $env:PATH = "$fakeDir;$env:PATH"
          $env:TH_SYNTHETIC_VOLUME_EXISTS = '0'
          $env:TH_SYNTHETIC_REVISION = (& git --no-optional-locks rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic source revision could not be read.' }
          $env:TH_SYNTHETIC_VERSION = 'ci-windows-package'
          $env:TH_SYNTHETIC_IMAGE_ARCHIVE = Join-Path $env:RUNNER_TEMP 'synthetic-docker-save.tar'
          $labels = [ordered]@{
            'org.toefl-house.source-eol' = 'lf-v1'
            'org.toefl-house.source-revision' = $env:TH_SYNTHETIC_REVISION
            'org.toefl-house.release-version' = $env:TH_SYNTHETIC_VERSION
          }
          $env:TH_SYNTHETIC_LABELS = $labels | ConvertTo-Json -Compress
          $configDigest = (& python -c "from pathlib import Path; import json, os; from tests.foundation.test_customer_package_manifest import write_image_archive; print(write_image_archive(Path(os.environ['TH_SYNTHETIC_IMAGE_ARCHIVE']), json.loads(os.environ['TH_SYNTHETIC_LABELS'])))").Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic Docker archive creation failed.' }
          $env:TH_SYNTHETIC_INSPECT_JSON = [ordered]@{
            # Containerd-backed Docker can expose a manifest digest as .Id.
            Id = 'sha256:' + ('c' * 64)
            RepoTags = @('toefl-house-erp-app:local')
            Config = @{ Labels = $labels }
          } | ConvertTo-Json -Depth 6 -Compress
          $target = Join-Path $env:RUNNER_TEMP "Customer Kits"
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "product/windows/Prepare Customer Package.ps1" -Destination $target -Version $env:TH_SYNTHETIC_VERSION -SourceRevision $env:TH_SYNTHETIC_REVISION
          if ($LASTEXITCODE -ne 0) { throw "Synthetic package creation failed." }
          $kits = @(Get-ChildItem -LiteralPath $target -Directory)
          if ($kits.Count -ne 1) { throw "Expected exactly one customer package." }
          $kit = $kits[0].FullName
          foreach ($relative in @(
            'TOEFL House ERP.vbs',
            'product/docker-compose.yml',
            'product/windows/TOEFL House ERP.ps1',
            'product/windows/Check This PC.ps1',
            'product/windows/Test Existing Installation.ps1',
            'product/windows/OWNER ACCEPTANCE GUIDE.txt',
            'product/windows/DAILY USE GUIDE.txt',
            'product/release/toefl-house-erp-app.tar',
            'product/release/toefl-house-erp-app.tar.sha256',
            'product/release/release-manifest.json',
            'product/release/release-manifest.json.sha256',
            'READ ME FIRST.txt'
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $kit $relative) -PathType Leaf)) {
              throw "Package missing $relative"
            }
          }
          if (Test-Path -LiteralPath (Join-Path $kit 'product/data')) {
            throw "Customer package included private application data."
          }
          $dailyGuide = [System.IO.File]::ReadAllText((Join-Path $kit 'product/windows/DAILY USE GUIDE.txt'))
          if ($dailyGuide -notmatch 'HOW TO USE' -or $dailyGuide -notmatch 'NO-GO') {
            throw "Customer kit omitted its nontechnical daily-use guide or release warning."
          }
          $ownerGuide = [System.IO.File]::ReadAllText((Join-Path $kit 'product/windows/OWNER ACCEPTANCE GUIDE.txt'))
          if ($ownerGuide -notmatch 'RELEASE DECISION: NO-GO' -or $ownerGuide -notmatch 'PRESERVATION') {
            throw "Customer kit omitted its Owner hold and safe first-check guidance."
          }
          # A corrupt first-run kit must be rejected before creating local data.
          # Use a separate synthetic copy so the valid package stays unchanged.
          $damagedKit = Join-Path $env:RUNNER_TEMP "Damaged Customer Kit"
          Copy-Item -LiteralPath $kit -Destination $damagedKit -Recurse -ErrorAction Stop
          $damagedArchive = Join-Path $damagedKit 'product/release/toefl-house-erp-app.tar'
          [System.IO.File]::AppendAllText($damagedArchive, "SYNTHETIC_CORRUPTION")
          $env:TH_GUI_MODE = '1'
          $damagedInstall = Join-Path $damagedKit 'product/windows/Install TOEFL House ERP.cmd'
          # A correctly rejected package emits stderr. Windows PowerShell
          # 5.1 wraps native stderr in a NativeCommandError when the CI
          # preference is Stop. Capture the EXPECTED refusal, then restore Stop.
          $previousPreference = $ErrorActionPreference
          try {
            $ErrorActionPreference = 'Continue'
            $rejectedOutput = @(& $damagedInstall 2>&1)
            $rejectedExit = $LASTEXITCODE
          } finally {
            $ErrorActionPreference = $previousPreference
          }
          if ($rejectedExit -eq 0) { throw "Damaged kit was accepted by installer." }
          if (Test-Path -LiteralPath (Join-Path $damagedKit 'product/data')) {
            throw "Damaged kit modified local ERP data before integrity verification."
          }
          if (($rejectedOutput -join [Environment]::NewLine) -notmatch 'Package integrity verification failed') {
            throw "Damaged kit refusal did not explain its cause."
          }
          # Check This PC must be runnable with an empty package and must
          # not create site files, secrets, Docker volumes or backups.
          if (Test-Path -LiteralPath (Join-Path $kit 'product/data')) {
            throw "Unexpected customer data before read-only PC check."
          }
          $checkScript = Join-Path $kit 'product/windows/Check This PC.ps1'
          $checkOutput = @(& powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $checkScript 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "Read-only PC check failed." }
          if (($checkOutput -join "`n") -notmatch 'Production authorization: NOT VERIFIED') {
            throw "Read-only PC check omitted release hold notice."
          }
          if (Test-Path -LiteralPath (Join-Path $kit 'product/data')) {
            throw "Read-only PC check unexpectedly changed customer data."
          }
          # Exercise the customer-facing CMD paths without real Docker or databases.
          $fakeCurl = 'public class FakeCurl { public static int Main(string[] args) { return 0; } }'
          Add-Type -TypeDefinition $fakeCurl -OutputAssembly (Join-Path $fakeDir 'curl.exe') -OutputType ConsoleApplication
          $env:TH_GUI_MODE = '1'
          foreach ($task in @('Install', 'Start', 'Stop', 'Repair')) {
            if ($task -eq 'Start') {
              # Fake Docker cannot create Frappe data. Model the successful
              # completed synthetic Install's site and named volume explicitly.
              $syntheticSite = Join-Path $kit 'product/data/sites/toeflhouse.localhost'
              New-Item -ItemType Directory -Path $syntheticSite -Force | Out-Null
              [System.IO.File]::WriteAllText((Join-Path $syntheticSite 'site_config.json'), '{}')
              $env:TH_SYNTHETIC_VOLUME_EXISTS = '1'
            }
            $script = Join-Path $kit ("product/windows/" + $task + " TOEFL House ERP.cmd")
            $output = @(& $script 2>&1)
            $taskExit = $LASTEXITCODE
            $stageSummary = @($output | Where-Object { $_ -match '^\[TH_STAGE\]' })
            Write-Host ("Synthetic " + $task + " exit=" + $taskExit + " stageCount=" + $stageSummary.Count)
            if ($stageSummary.Count -eq 0) {
              $safeMessages = @($output | Where-Object { $_ -match 'Docker Desktop|Windows could not|missing|failed|could not|site|install|script|data|database' } | Select-Object -First 8)
              foreach ($line in $safeMessages) { Write-Host ("Synthetic diagnostic: " + (($line -replace 'MARIADB_ROOT_PASSWORD=.*', 'MARIADB_ROOT_PASSWORD=[REDACTED]') -replace 'Password:.*', 'Password:[REDACTED]')) }
            }
            if ($taskExit -ne 0) {
              throw ("Headless " + $task + " failed: " + ($output | Out-String))
            }
            if (($output | Out-String) -match 'Username: Administrator|Password: ') {
              throw "Headless execution leaked the initial Administrator credentials."
            }
          }
          if (-not (Test-Path -LiteralPath (Join-Path $kit 'product/data/secrets/db.env') -PathType Leaf)) {
            $productData = Join-Path $kit 'product/data'
            Write-Host ("Diagnostic: kit product data directory exists=" + (Test-Path -LiteralPath $productData))
            if (Test-Path -LiteralPath $productData) {
              Get-ChildItem -LiteralPath $productData -Recurse -Force | ForEach-Object { Write-Host ("Diagnostic path: " + $_.FullName) }
            }
            throw "Headless synthetic install did not generate its local credential file."
          }
          Write-Host "Headless installer, start, stop and repair routes passed with fake Docker."
          # Accidental Install on an already completed site must refuse before
          # regenerating credentials, importing an image or invoking Compose.
          $repeatInstall = Join-Path $kit 'product/windows/Install TOEFL House ERP.cmd'
          $previousPreference = $ErrorActionPreference
          try {
            $ErrorActionPreference = 'Continue'
            $alreadyInstalledOutput = @(& $repeatInstall 2>&1)
            $alreadyInstalledExit = $LASTEXITCODE
          } finally {
            $ErrorActionPreference = $previousPreference
          }
          if ($alreadyInstalledExit -eq 0 -or
              ($alreadyInstalledOutput -join "`n") -notmatch 'no installation attempted') {
            throw "Repeated Install did not refuse the existing Frappe site."
          }
          Write-Host "Repeated Install was refused safely."
          # Partial-install protection: credentials alone must prevent Install
          # even when the synthetic Frappe site config is temporarily absent.
          $siteConfig = Join-Path $kit 'product/data/sites/toeflhouse.localhost/site_config.json'
          $heldSiteConfig = "$siteConfig.synthetic-hold"
          Move-Item -LiteralPath $siteConfig -Destination $heldSiteConfig
          try {
            $missingSiteOutput = @(& powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $checkScript 2>&1)
            if ($LASTEXITCODE -ne 0 -or
                ($missingSiteOutput -join "`n") -notmatch 'BLOCKED: credentials exist but site configuration is missing') {
              throw "Owner read-only PC check missed a missing Frappe site configuration."
            }
            $previousPreference = $ErrorActionPreference
            try {
              $ErrorActionPreference = 'Continue'
              $partialInstallOutput = @(& $repeatInstall 2>&1)
              $partialInstallExit = $LASTEXITCODE
            } finally {
              $ErrorActionPreference = $previousPreference
            }
            if ($partialInstallExit -eq 0 -or
                ($partialInstallOutput -join "`n") -notmatch 'no installation attempted') {
              throw "Partial install with preserved credentials was treated as a fresh install."
            }
          } finally {
            Move-Item -LiteralPath $heldSiteConfig -Destination $siteConfig
          }
          Write-Host "Partial install with preserved credentials was refused safely."
          # A missing database volume with credentials + site config present
          # must NOT allow Compose to create an empty replacement database.
          $env:TH_SYNTHETIC_VOLUME_EXISTS = '0'
          $missingVolumeCheck = @(& powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $checkScript 2>&1)
          if ($LASTEXITCODE -ne 0 -or
              ($missingVolumeCheck -join "`n") -notmatch 'NOT VERIFIED: credentials exist but the database volume could not be confirmed') {
            throw "Owner read-only PC check missed a missing named database volume."
          }
          $blockedStart = Join-Path $kit 'product/windows/Start TOEFL House ERP.cmd'
          $previousPreference = $ErrorActionPreference
          try {
            $ErrorActionPreference = 'Continue'
            $lostVolumeOutput = @(& $blockedStart 2>&1)
            $lostVolumeExit = $LASTEXITCODE
          } finally {
            $ErrorActionPreference = $previousPreference
            $env:TH_SYNTHETIC_VOLUME_EXISTS = '1'
          }
          if ($lostVolumeExit -eq 0 -or ($lostVolumeOutput -join "`n") -notmatch 'BLOCKED TO PRESERVE DATA') {
            throw "Start accepted a missing database volume; data preservation guard failed."
          }
          if (($lostVolumeOutput -join "`n") -match 'Starting the installed TOEFL House ERP') {
            throw "Start reached Docker Compose despite a missing database volume."
          }
          Write-Host "Missing native database volume was refused without a start attempt."
          # Simulate a lost credential file after synthetic installation. The
          # read-only check must catch it without viewing password contents.
          $credential = Join-Path $kit 'product/data/secrets/db.env'
          $heldCredential = "$credential.synthetic-hold"
          if (Test-Path -LiteralPath $heldCredential) {
            throw "Unexpected synthetic credential hold file."
          }
          Move-Item -LiteralPath $credential -Destination $heldCredential
          try {
            $blockedCheck = @(& powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $checkScript 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "Read-only missing-credential check failed." }
            if (($blockedCheck -join "`n") -notmatch 'BLOCKED: existing site/database but credential file missing') {
              throw "Read-only check failed to warn about preserved data and missing credentials."
            }
          } finally {
            Move-Item -LiteralPath $heldCredential -Destination $credential
          }
          Write-Host "Missing-credential preservation check passed."
          $tar = Join-Path $kit 'product/release/toefl-house-erp-app.tar'
          $sha = "$tar.sha256"
          $manifest = Join-Path $kit 'product/release/release-manifest.json'
          function Assert-PackageVerification {
            param([bool]$ShouldPass, [switch]$Loaded)
            $verifyArgs = @('-NoLogo', '-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass',
              '-File', 'product/windows/Verify Package Image.ps1', '-Archive', $tar,
              '-Checksum', $sha, '-Manifest', $manifest)
            if ($Loaded) { $verifyArgs += '-VerifyLoadedImage' }
            $previousPreference = $ErrorActionPreference
            try {
              $ErrorActionPreference = 'Continue'
              $verifyOutput = @(& powershell.exe @verifyArgs 2>&1)
              $verifyExit = $LASTEXITCODE
            } finally { $ErrorActionPreference = $previousPreference }
            if (($verifyExit -eq 0) -ne $ShouldPass) {
              throw ('Unexpected package verification result: ' + ($verifyOutput | Out-String))
            }
          }
          Assert-PackageVerification $true
          Assert-PackageVerification $true -Loaded
          $originalManifest = [System.IO.File]::ReadAllBytes($manifest)
          try {
            [System.IO.File]::AppendAllText($manifest, ' ')
            Assert-PackageVerification $false
            Assert-PackageVerification $false -Loaded
          } finally { [System.IO.File]::WriteAllBytes($manifest, $originalManifest) }
          $manifestChecksum = "$manifest.sha256"
          $originalManifestChecksum = [System.IO.File]::ReadAllBytes($manifestChecksum)
          try {
            Remove-Item -LiteralPath $manifestChecksum
            Assert-PackageVerification $false
            [System.IO.File]::WriteAllText($manifestChecksum, 'not-a-digest')
            Assert-PackageVerification $false
          } finally { [System.IO.File]::WriteAllBytes($manifestChecksum, $originalManifestChecksum) }
          $originalInspect = $env:TH_SYNTHETIC_INSPECT_JSON
          try {
            $wrongImage = $originalInspect | ConvertFrom-Json
            $wrongImage.Id = 'sha256:' + ('0' * 64)
            $env:TH_SYNTHETIC_INSPECT_JSON = $wrongImage | ConvertTo-Json -Depth 6 -Compress
            Assert-PackageVerification $true -Loaded
            $wrongImage = $originalInspect | ConvertFrom-Json
            $wrongImage.Config.Labels.'org.toefl-house.source-revision' = 'b' * 40
            $env:TH_SYNTHETIC_INSPECT_JSON = $wrongImage | ConvertTo-Json -Depth 6 -Compress
            Assert-PackageVerification $false -Loaded
          } finally { $env:TH_SYNTHETIC_INSPECT_JSON = $originalInspect }
          Add-Content -LiteralPath $tar -Value 'TAMPERED'
          Assert-PackageVerification $false
          Write-Host "Package allowlist, manifest/image integrity and loaded identity checks passed."
          exit 0
