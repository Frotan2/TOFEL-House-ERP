name: One-time verified retirement of PR 124-126 branches
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/retire-pr124-126-once.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  retire-verified-heads:
    if: github.repository == 'Frotan2/TOFEL-House-ERP'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact main ancestry
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Delete only exact fully merged or accounted-for branch refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Frotan2/TOFEL-House-ERP'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          for n in 124 125; do
            test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$n" --jq '.merged')" = true
          done
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/126" --jq '.state')" = closed
          set -- \
            'fix/reception-registration-flow-20261101|d44189d43148d0255aa8f57bab17cd4f350ca892' \
            'fix/reception-branch-collection-native-20261102|91a0589cc6a9a0b0fe1f90722b5c701353305e55' \
            'fix/finance-cash-only-day-close-20261102|76c7b942461812d19f46ccf47309f5188586932d'
          # Verify the complete list before deleting anything.
          for entry in "$@"; do
            branch="$(printf '%s' "$entry" | cut -d '|' -f1)"
            expected="$(printf '%s' "$entry" | cut -d '|' -f2)"
            actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')"
            test "$actual" = "$expected"
            git cat-file -e "$expected^{commit}"
            git merge-base --is-ancestor "$expected" HEAD
            echo "Verified exact merged head: $branch"
          done
          for entry in "$@"; do
            branch="$(printf '%s' "$entry" | cut -d '|' -f1)"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" --silent
            echo "Retired fully integrated branch: $branch"
          done
