# TRANSIENT (diagnosis only) — not a gate. Mirrors the one-click installer's
# `docker compose build` semantics for product/app.Dockerfile so the
# real-Windows build failure at the `bench init` RUN line can be executed and
# read with full plain progress output on a stock Linux Docker daemon
# (rule-boundary: the engineering sandbox has no Docker and these steps were
# never executed anywhere before the owner's Windows E2E reached them).
# Raw run logs are not fetchable from the engineering sandbox; on failure the
# last build lines are posted as a throwaway issue (closed immediately) which
# is readable over api.github.com. Removed after diagnosis; gates untouched.
name: Product image diagnostic (transient)

on:
  push:
    branches: ["arena/01a0cd90-tofel-house-erp"]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: docker build product/app.Dockerfile (plain progress)
        run: |
          set +e
          docker build --progress=plain \
            -f product/app.Dockerfile \
            -t toeflerp-diagnostic:diag . > /tmp/build.out 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            {
              printf 'Transient diagnostic capture (docker build tail).\n\n```text\n'
              tail -n 150 /tmp/build.out
              printf '\n```\n'
            } > /tmp/issue.md
            issue=$(gh api -X POST repos/${{ github.repository }}/issues \
              -f title="diag(transient): image build capture ${{ github.run_id }}" \
              -F body=@/tmp/issue.md --jq .number)
            gh issue close "$issue" --comment "diagnostic capture complete" || true
            exit "$code"
          fi
          echo "IMAGE BUILD SUCCEEDED"
