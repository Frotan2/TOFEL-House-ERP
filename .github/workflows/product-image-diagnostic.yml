# TRANSIENT (diagnosis only) — not a gate. Mirrors the one-click installer's
# `docker compose build` semantics for product/app.Dockerfile so the
# real-Windows build failure at the `bench init` RUN line can be executed and
# read with full plain progress output on a stock Linux Docker daemon
# (rule-boundary: the engineering sandbox has no Docker and these steps were
# never executed anywhere before the owner's Windows E2E reached them).
# Removed again once the failure class is closed by the production fix.
name: Product image diagnostic (transient)

on:
  push:
    branches: ["arena/01a0cd90-tofel-house-erp"]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: docker build product/app.Dockerfile (plain progress)
        run: |
          docker build --progress=plain \
            -f product/app.Dockerfile \
            -t toeflerp-diagnostic:diag .
