name: Foundation runtime validation

on:
  push:
    branches: [arena/01a0b084-tofel-house-erp]
    paths:
      - .github/workflows/foundation-runtime.yml
      - tools/session_branch.py
      - tools/foundation/runtime_*.py
      - tools/foundation/runtime_*.mjs
      - tools/foundation/runtime_*.cjs
      - tests/foundation/**
      - apps/foundation_security/**
      - tools/foundation/publish_evidence.py
      - docs/engineering/foundation-version-matrix.json
  workflow_dispatch:
    inputs:
      profile:
        description: "Hardened acceptance or historical unsafe-baseline forensics"
        type: choice
        options: [hardened, forensic]
        default: hardened

permissions:
  contents: read
  checks: write

concurrency:
  group: foundation-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime:
    if: github.ref == 'refs/heads/arena/01a0b084-tofel-house-erp'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Test owned qualification policies
        run: |
          python3 -m unittest discover -s tests/foundation -q
          node tests/foundation/test_realtime_guard.cjs
      - name: Install pinned Yarn CLI
        run: npm install --global yarn@1.22.22
      - name: Establish fresh compatible Python and services
        run: python3 tools/foundation/runner_probe.py
      - name: Install and validate the pinned foundation
        env:
          FOUNDATION_PROFILE: ${{ inputs.profile || 'hardened' }}
        run: python3 tools/foundation/runtime_install.py
      - name: Publish sanitized runtime evidence
        if: always() && hashFiles('.foundation/runtime-evidence/runtime-result.json') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/foundation/publish_evidence.py .foundation/runtime-evidence/runtime-result.json --name 'Foundation runtime evidence'
      - name: Publish remaining gate evidence
        if: always() && hashFiles('.foundation/runtime-evidence/continuation-result.json') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/foundation/publish_evidence.py .foundation/runtime-evidence/continuation-result.json --name 'Foundation remaining gate evidence'
      - name: Retain qualification evidence, including failed gates
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: foundation-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .foundation/runtime-evidence/
            .foundation/runner-evidence/
          if-no-files-found: error
          retention-days: 14
