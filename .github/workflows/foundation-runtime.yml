name: Foundation runtime

# Installs the pinned stack with foundation_security in the hardened profile and
# runs the runtime smoke, permission, realtime, upgrade/restore and dependency
# advisory (SEC-DEPS-01) checks.
on:
  push:
    paths:
      - .github/workflows/foundation-runtime.yml
      - tools/foundation/**
      - tools/native/site_setup.py
      - product/bootstrap.py
      - tools/native/run_product_backup.py
      - tests/foundation/test_native_credential_adapters.py
      - apps/foundation_security/**
      - apps/toefl_house/**
      - docs/engineering/foundation-version-matrix.json
      - docs/owner-decisions.json
      # The SEC-DEPS-01 dispositions are read by tools/foundation/advisory_triage.py,
      # so any disposition change must re-run the audit that consumes it.
      - docs/engineering/evidence/sec-deps-01/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Foundation contract tests
        run: |
          python3 tools/foundation/annotated_step.py "foundation contract tests" -- python3 -m unittest discover -s tests/foundation -q
          python3 tools/foundation/annotated_step.py "realtime guard" -- node tests/foundation/test_realtime_guard.cjs
      - name: Install pinned Yarn CLI
        run: npm install --global yarn@1.22.22
      - name: Establish fresh compatible Python and services
        run: python3 tools/foundation/runner_probe.py
      - name: Install and validate the pinned foundation
        run: python3 tools/foundation/runtime_install.py
      - name: Retain results, including failed gates
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: foundation-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .foundation/runtime-evidence/
            .foundation/runner-evidence/
          if-no-files-found: error
          retention-days: 14
