name: Foundation runtime validation

on:
  push:
    branches: [arena/01a09bf3-tofel-house-erp]
    paths:
      - .github/workflows/foundation-runtime.yml
      - tools/foundation/runtime_*.py
      - tools/foundation/runtime_*.mjs
      - apps/foundation_security/**
      - tools/foundation/publish_evidence.py
      - docs/engineering/foundation-version-matrix.json
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: foundation-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime:
    if: github.ref == 'refs/heads/arena/01a09bf3-tofel-house-erp'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Install pinned Yarn CLI
        run: npm install --global yarn@1.22.22
      - name: Establish fresh compatible Python and services
        run: python3 tools/foundation/runner_probe.py
      - name: Install and validate the pinned foundation
        run: python3 tools/foundation/runtime_install.py
      - name: Publish sanitized runtime evidence
        if: always() && hashFiles('.foundation/runtime-evidence/runtime-result.json') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/foundation/publish_evidence.py .foundation/runtime-evidence/runtime-result.json --name 'Foundation runtime evidence'
      - name: Retain qualification evidence, including failed gates
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foundation-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .foundation/runtime-evidence/
            .foundation/runner-evidence/
          if-no-files-found: error
          retention-days: 14
