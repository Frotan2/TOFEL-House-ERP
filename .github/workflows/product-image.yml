name: Product image

# Builds the desktop application image exactly as the owner's machine does
# (product/app.Dockerfile via product/docker-compose.yml) and validates the
# compose file, then boots the stack and qualifies disposable synthetic Owner
# backup/recovery material plus the guarded operational site-mode lifecycle.
# This is not production authorization or real Windows/Owner key-custody proof.
on:
  push:
    paths:
      - .github/workflows/product-image.yml
      - .gitattributes
      - .dockerignore
      - tests/foundation/test_product_packaging.py
      - product/**
      - apps/**
      - docs/engineering/foundation-version-matrix.json
      - docs/engineering/LAUNCH-RUNBOOK.md
      - docs/PRODUCT.md
      - docs/owner-decisions.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Validate compose file
        # db.env is generated per machine by the Windows installer; CI uses a
        # throwaway value only to let compose resolve the env_file.
        run: |
          install -d -m 700 product/data/secrets product/data/activation
          ci_db_password="$(openssl rand -hex 24)"
          echo "::add-mask::$ci_db_password"
          printf 'MARIADB_ROOT_PASSWORD=%s\n' "$ci_db_password" > product/data/secrets/db.env
          unset ci_db_password
          sudo chown "$(id -u):1000" product/data/secrets product/data/secrets/db.env product/data/activation
          chmod 750 product/data/secrets product/data/activation
          chmod 640 product/data/secrets/db.env
          docker compose -f product/docker-compose.yml config --quiet
      - name: Node tarball integrity (official nodejs.org SHASUMS256)
        # Resolves the published sha256 of the exact Node tarball the Dockerfile
        # downloads. If the matrix carries a pin, any upstream drift fails the
        # build here, before anything is compiled; the live value is what the
        # build verifies.
        run: |
          set -euo pipefail
          node_version=$(python3 -c "
          import json
          matrix = json.load(open('docs/engineering/foundation-version-matrix.json'))
          print(next(c['selected_version'] for c in matrix['components'] if c['name'] == 'node'))
          ")
          curl -fsSL "https://nodejs.org/dist/v${node_version}/SHASUMS256.txt" -o /tmp/node-shasums.txt
          live=$(grep -E " node-v${node_version}-linux-x64\.tar\.xz\$" /tmp/node-shasums.txt | awk '{print $1}')
          test -n "$live"
          pinned=$(python3 -c "
          import json
          matrix = json.load(open('docs/engineering/foundation-version-matrix.json'))
          print(next(c.get('tarball_sha256', '') for c in matrix['components'] if c['name'] == 'node'))
          ")
          if [ -n "$pinned" ] && [ "$pinned" != "$live" ]; then
            echo "::error::Node tarball sha256 drift: matrix pins ${pinned}, nodejs.org publishes ${live}"
            exit 1
          fi
          echo "NODE_TARBALL_SHA256=${live}" >> "$GITHUB_ENV"
          if [ -n "$pinned" ]; then
            echo "::notice title=Node tarball::v${node_version} linux-x64 sha256 ${live} (matrix pin verified)"
          else
            echo "::notice title=Node tarball::v${node_version} linux-x64 sha256 ${live} (recorded; matrix pin pending)"
          fi
      - name: Record base image resolved digest
        # The Python base image is pinned by exact patch tag; record the
        # registry-resolved digest for traceability. This does not turn the
        # tag into a digest pin or claim a bit-for-bit reproducible image;
        # remaining unlocked inputs are listed in the canonical matrix.
        run: |
          set -euo pipefail
          base=$(python3 -c "
          import json
          matrix = json.load(open('docs/engineering/foundation-version-matrix.json'))
          print('python:' + next(c['selected_version'] for c in matrix['components'] if c['name'] == 'python') + '-slim-bookworm')
          ")
          digest=$(docker buildx imagetools inspect "$base" 2>/dev/null | grep -m1 -oE 'sha256:[0-9a-f]{64}' || true)
          echo "::notice title=Base image digest::${base} -> ${digest:-not resolvable from this runner}"
      - name: Build application image (from a simulated fresh Windows worktree)
        # This fresh checkout runs core.autocrlf=true, the Windows Git
        # configuration that previously materialized Linux scripts as CRLF.
        # The line-ending tests inspect every Dockerfile COPY source before
        # build; the Dockerfile repeats the guard after COPY, and the image
        # shebangs are byte-checked after build.
        run: |
          set -euo pipefail
          git clone -q --no-checkout "file://$GITHUB_WORKSPACE" /tmp/win-worktree
          git -C /tmp/win-worktree config core.autocrlf true
          git -C /tmp/win-worktree checkout -q "$GITHUB_SHA"
          cd /tmp/win-worktree
          python3 tools/foundation/annotated_step.py "Fresh Windows checkout EOL contract" -- python3 -m unittest tests.foundation.test_product_packaging.LineEndingContract tests.foundation.test_product_packaging.CmdParserSafetyContract tests.foundation.test_product_packaging.CmdSyntaxContract
          first_line=$(head -c 10 product/entrypoint.sh | od -An -tx1 | tr -d ' \n')
          test "$first_line" = "23212f62696e2f73680a"   # exactly "#!/bin/sh\n"
          ! grep -q $'\r' product/entrypoint.sh
          ! grep -q $'\r' .dockerignore
          for f in product/windows/*.cmd; do
            head -1 "$f" | grep -q $'\r$'
          done
          echo "::notice title=Fresh Windows checkout::all copied text sources and build-control files are LF; .cmd launchers are CRLF"
          docker build --build-arg NODE_TARBALL_SHA256="${NODE_TARBALL_SHA256}" -f product/app.Dockerfile -t toefl-house-erp-app:ci -t toefl-house-erp-app:local /tmp/win-worktree
          # Inspect the actual image bytes. entrypoint.sh is exec'd by the
          # kernel; the Python entrypoints are invoked directly by wrappers.
          in_image=$(docker run --rm --entrypoint sh toefl-house-erp-app:ci -c 'head -c 10 /product/entrypoint.sh | od -An -tx1 | tr -d " \n"')
          test "$in_image" = "23212f62696e2f73680a"
          for script in bootstrap.py activate.py perf_baseline.py; do
            shebang=$(docker run --rm --entrypoint sh toefl-house-erp-app:ci -c "head -c 23 /product/$script")
            test "$shebang" = "$(printf '#!/usr/bin/env python3\n')"
          done
          label=$(docker image inspect --format '{{index .Config.Labels "org.toefl-house.source-eol"}}' toefl-house-erp-app:ci)
          test "$label" = "lf-v1"
          echo "::notice title=Image EOL contract::entrypoint/Python shebangs, copied text inputs, and source-eol label verified in the built image"
      - name: Report image footprint
        run: |
          set -euo pipefail
          size() { docker image inspect "$1" --format '{{.Size}}' | awk '{printf "%.0f MB", $1/1000000}'; }
          echo "::notice title=Image size::toefl-house-erp-app $(size toefl-house-erp-app:ci)"
          layers=$(docker history --format '{{.Size}} {{.CreatedBy}}' toefl-house-erp-app:ci | grep -v '^0B' | cut -c1-90 | head -12 | paste -sd'|' -)
          echo "::notice title=Largest layers::${layers}"
          usage=$(docker run --rm --entrypoint sh toefl-house-erp-app:ci -c 'du -sm /home/frappe/bench/env /home/frappe/bench/apps/* /build/sources /build/owned /build/tools /usr/local /usr/lib /home/frappe/.cache 2>/dev/null | sort -rn' | awk '{print $1"MB "$2}' | paste -sd'|' -)
          echo "::notice title=Disk usage in image::${usage}"
      - name: First boot, encrypted backup/restore and guarded site-mode activation
        working-directory: product
        run: |
          python3 ../tools/foundation/annotated_step.py "First boot, encrypted backup/restore and guarded site-mode activation" -- bash -euo pipefail <<'TOEFL_FIRST_BOOT'
          checkpoint="site startup"
          trap 'rc=$?; echo "::error title=Product image first-boot failure::checkpoint=$checkpoint exit=$rc"; exit "$rc"' ERR
          mkdir -p data/sites data/logs && chmod 777 data/sites data/logs
          sudo chown "$(id -u):1000" data/secrets data/secrets/db.env data/activation
          chmod 750 data/secrets data/activation
          chmod 640 data/secrets/db.env
          docker compose up -d --no-build
          for i in $(seq 1 300); do curl --fail --silent http://127.0.0.1:8000/ >/dev/null && break; sleep 10; done
          curl --fail --silent http://127.0.0.1:8000/ >/dev/null
          echo "::notice title=First boot::site answered after ~$((i*10))s"
          checkpoint="initial status and fail-closed mode"
          act() { docker compose exec -T web /product/activate.py "$@"; }
          act status | tee status.txt
          grep -q 'Site operational mode: REFUSED' status.txt
          grep -q 'Production authorization: REJECT' status.txt

          checkpoint="ephemeral Owner recovery-key generation"
          # Create an ephemeral OpenPGP recovery identity on the runner. The
          # private key stays in RUNNER_TEMP, outside Frappe and outside the
          # mounted secondary backup volume; only its public half is sent to
          # the disposable Course Owner policy and web container.
          ci_gnupg_home="$RUNNER_TEMP/toefl-house-ci-gpg-$GITHUB_RUN_ID"
          recovery_public_key_path="$RUNNER_TEMP/toefl-house-ci-recovery-public-$GITHUB_RUN_ID.asc"
          recovered_config_path="$RUNNER_TEMP/toefl-house-ci-recovered-config-$GITHUB_RUN_ID.json"
          ci_gpg_container_home="/tmp/toefl-house-ci-gpg-$GITHUB_RUN_ID"
          cleanup_recovery_material() {
            if [ -n "${ci_gpg_container_home:-}" ]; then
              docker compose exec -T web rm -rf -- "$ci_gpg_container_home" >/dev/null 2>&1 || true
            fi
            if [ -n "${ci_gnupg_home:-}" ]; then
              gpgconf --homedir "$ci_gnupg_home" --kill gpg-agent >/dev/null 2>&1 || true
              rm -rf -- "$ci_gnupg_home"
            fi
            rm -f -- "${recovery_public_key_path:-}" "${recovered_config_path:-}"
          }
          trap cleanup_recovery_material EXIT
          mkdir -m 700 -p "$ci_gnupg_home"
          recovery_key_uid="TOEFL House disposable recovery key ${GITHUB_RUN_ID} <toefl-house-ci-${GITHUB_RUN_ID}@example.invalid>"
          printf '\n' | gpg --homedir "$ci_gnupg_home" --batch --pinentry-mode loopback --passphrase-fd 0 \
            --quick-generate-key "$recovery_key_uid" rsa2048 encr 1d
          recovery_fingerprint="$(gpg --homedir "$ci_gnupg_home" --with-colons --fingerprint "$recovery_key_uid" \
            | awk -F: '$1 == "fpr" { print $10; exit }')"
          test -n "$recovery_fingerprint" || { echo "::error::disposable recovery key generation returned no fingerprint"; exit 1; }
          gpg --homedir "$ci_gnupg_home" --armor --export "$recovery_fingerprint" > "$recovery_public_key_path"
          test -s "$recovery_public_key_path"
          recovery_key_b64="$(base64 -w0 "$recovery_public_key_path")"
          recovery_key_sha256="$(python3 - "$recovery_public_key_path" <<'PY'
          import hashlib, pathlib, sys
          print(hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes().strip()).hexdigest())
          PY
          )"

          checkpoint="synthetic Course Owner policy commands"
          # Create a disposable Course Owner through native Frappe User/Role
          # and the guarded Owner policy commands. Schedule and retention are
          # synthetic CI values, never product defaults or Owner evidence.
          docker compose exec -T -e TH_CI_RECOVERY_PUBLIC_KEY_B64="$recovery_key_b64" \
            web /build/tools/bin/bench --site toeflhouse.localhost console <<'PY'
          import base64
          import os
          import frappe
          from toefl_house.operations.owner_configuration import (
              create_owner_operations_policy,
              set_owner_operations_policy_version,
              validate_owner_operations_policy,
          )
          recovery_public_key = base64.b64decode(
              os.environ["TH_CI_RECOVERY_PUBLIC_KEY_B64"], validate=True
          ).decode("ascii")
          owner_email = "backup-owner@toeflhouse.localhost"
          if not frappe.db.exists("User", owner_email):
              owner = frappe.get_doc({
                  "doctype": "User", "email": owner_email,
                  "first_name": "Backup Qualification Owner", "enabled": 1,
                  "send_welcome_email": 0,
                  "roles": [{"doctype": "Has Role", "role": "Course Owner"}],
              })
              owner.insert(ignore_permissions=True)
              frappe.db.commit()
          previous_user = frappe.session.user
          frappe.session.user = owner_email
          try:
              if not frappe.db.exists("TH Owner Operations Policy", {"code": "TH-OWNER-OPS"}):
                  create_owner_operations_policy(
                      "ci-backup-policy-create", "TH-OWNER-OPS",
                      "CI backup policy", "Disposable synthetic qualification fixture")
              set_owner_operations_policy_version(
                  "ci-backup-policy-v1", "TH-OWNER-OPS", frappe.utils.today(),
                  "Disposable policy fixture for product backup/restore qualification",
                  30, 20, 0, 0, 0, 0, 0, 0,
                  "02:30", 3, "Preserve all valid backup sets", recovery_public_key,
                  "CI-only key-custody fixture; not real recovery evidence", 1)
              validate_owner_operations_policy(
                  "ci-backup-policy-validation", "TH-OWNER-OPS")
              frappe.db.commit()
          finally:
              frappe.session.user = previous_user
          print("CI Course Owner backup policy configured through guarded commands")
          PY
          checkpoint="effective Owner backup-policy projection and key identity"
          policy_json="$(docker compose exec -T web /build/tools/bin/bench --site toeflhouse.localhost execute toefl_house.operations.owner_configuration.current_backup_policy)"
          printf '%s\n' "$policy_json" | python3 -c 'import json,sys; d=json.loads(sys.stdin.read().splitlines()[-1]); assert d["configured"] is True and d["retention_versions"] >= 2 and d["retention_behavior"] == "Preserve all valid backup sets" and d["recovery_key_sha256"] == sys.argv[1]; print("::notice title=Owner backup policy::synthetic CI policy/key identity configured through the guarded Course Owner command")' "$recovery_key_sha256"

          checkpoint="activation refusal without a verified backup"
          # The product activation command must refuse before a complete
          # encrypted, separate-volume backup receipt exists.
          set +e; act activate --confirm toeflhouse.localhost; rc=$?; set -e
          test "$rc" = 2

          checkpoint="native encrypted database/public/private file backup"
          docker compose exec -T web /build/tools/bin/bench --site toeflhouse.localhost execute "frappe.db.set_single_value('System Settings', 'encrypt_backup', 1)"
          backup_dir="data/sites/toeflhouse.localhost/private/backups"
          file_marker="ERP-RESTORE-FILE-${GITHUB_RUN_ID}"
          docker compose exec -T -e CI_BACKUP_FILE_MARKER="$file_marker" web sh -eu -c '
            mkdir -p sites/toeflhouse.localhost/public/files sites/toeflhouse.localhost/private/files
            printf "%s\n" "$CI_BACKUP_FILE_MARKER" > sites/toeflhouse.localhost/public/files/product-image-restore-marker.txt
            printf "%s\n" "$CI_BACKUP_FILE_MARKER" > sites/toeflhouse.localhost/private/files/product-image-restore-marker.txt
          '
          docker compose run --rm --no-deps --entrypoint /home/frappe/bench/env/bin/python web /product/backup.py
          encrypted_db="$(find "$backup_dir" -maxdepth 1 -type f -name '*-database-enc.sql.gz' -printf '%T@ %f\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$encrypted_db" || { echo "::error::encrypted database artifact not found"; find "$backup_dir" -maxdepth 1 -type f -printf '%f\n' | sort; exit 1; }
          backup_set="${encrypted_db%-database-enc.sql.gz}"
          encrypted_names=("$encrypted_db" "${backup_set}-files-enc.tar" "${backup_set}-private-files-enc.tar")
          checkpoint="GPG verification of native database and file artifacts"
          for name in "${encrypted_names[@]}"; do
            test -s "$backup_dir/$name" || { echo "::error::required encrypted artifact missing: $name"; exit 1; }
            packet_output="$(docker compose exec -T web gpg --batch --list-packets "sites/toeflhouse.localhost/private/backups/$name" 2>&1)" || {
              echo "::error::GPG packet inspection failed for $name: ${packet_output:0:500}"; exit 1;
            }
            printf '%s\n' "$packet_output" | grep -q ':symkey enc packet:' || {
              echo "::error::artifact name is not proof of GPG encryption: $name"; exit 1;
            }
          done

          # Frappe creates a site-config sidecar with a misleading -enc name;
          # it is plaintext and contains DB credentials plus the native backup
          # key. Encrypt this exact sidecar to the disposable Owner public key
          # from inside the pinned product image; never put the plaintext on
          # the secondary volume. The runner's private key stays outside both.
          checkpoint="public-key site-config recovery and sidecar safety"
          mapfile -t config_sidecars < <(find "$backup_dir" -maxdepth 1 -type f \
            -name "${backup_set}-site_config_backup*.json" -print)
          test "${#config_sidecars[@]}" -eq 1 || {
            echo "::error::expected exactly one Frappe site-config backup sidecar for $backup_set"; exit 1;
          }
          site_config_sidecar="${config_sidecars[0]}"
          recovery_config_name="${backup_set}-site-config.gpg"
          recovery_config_path="$backup_dir/$recovery_config_name"
          ci_site_path="sites/toeflhouse.localhost/private/backups"
          ci_sidecar_path="$ci_site_path/$(basename "$site_config_sidecar")"
          ci_recovery_config_path="$ci_site_path/$recovery_config_name"
          docker compose exec -T web mkdir -m 700 -p "$ci_gpg_container_home"
          docker compose cp "$recovery_public_key_path" \
            "web:$ci_gpg_container_home/recovery-public.asc"
          docker compose exec -T web gpg --batch --homedir "$ci_gpg_container_home" \
            --import "$ci_gpg_container_home/recovery-public.asc"
          docker compose exec -T web gpg --batch --yes --no-tty \
            --homedir "$ci_gpg_container_home" --trust-model always \
            --recipient "$recovery_fingerprint" --output "$ci_recovery_config_path" \
            --encrypt "$ci_sidecar_path"
          test -s "$recovery_config_path" || { echo "::error::encrypted site-config recovery artifact missing"; exit 1; }
          config_packets="$(docker compose exec -T web gpg --batch --homedir "$ci_gpg_container_home" \
            --list-packets "$ci_recovery_config_path" 2>&1)"
          printf '%s\n' "$config_packets" | grep -q ':pubkey enc packet:' || {
            echo "::error::site-config artifact is not an OpenPGP public-key encrypted packet"; exit 1;
          }
          (umask 077; gpg --homedir "$ci_gnupg_home" --batch --yes \
            --output "$recovered_config_path" --decrypt "$recovery_config_path")
          chmod 600 "$recovered_config_path"
          cmp --silent "$site_config_sidecar" "$recovered_config_path" || {
            echo "::error::private-key recovery did not reproduce the exact site-config sidecar"; exit 1;
          }
          backup_encryption_key="$(python3 - "$recovered_config_path" <<'PY'
          import json, pathlib, sys
          config = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          key = config.get("backup_encryption_key")
          if not isinstance(key, str) or not key:
              raise SystemExit("recovered site config has no native Frappe backup_encryption_key")
          print(key)
          PY
          )"
          test -n "$backup_encryption_key" || { echo "::error::recovered Frappe encryption key is empty"; exit 1; }
          echo "::add-mask::$backup_encryption_key"
          rm -f -- "${config_sidecars[@]}"
          if find "$backup_dir" -maxdepth 1 -type f -name '*-site_config_backup*.json' -print -quit | grep -q .; then
            echo "::error::plaintext Frappe site-config sidecar remains"; exit 1
          fi

          checkpoint="separate-filesystem copy and manifest/receipt verification"
          # Model a second local volume in CI with a loop-backed ext4 mount,
          # then prove it is a distinct filesystem before copying. This is a
          # product-image integration test, not qualification of a real
          # Windows disk or Windows Task Scheduler.
          backup_image="$RUNNER_TEMP/toefl-house-backup-volume.img"
          truncate -s 2G "$backup_image"
          backup_device="$(sudo losetup --find --show "$backup_image")"
          sudo mkfs.ext4 -F "$backup_device" >/dev/null
          sudo mkdir -p /mnt/toefl-house-backup
          sudo mount "$backup_device" /mnt/toefl-house-backup
          sudo chmod 777 /mnt/toefl-house-backup
          source_device="$(stat -c '%d' "$backup_dir")"
          secondary_device="$(stat -c '%d' /mnt/toefl-house-backup)"
          test "$source_device" != "$secondary_device" || { echo "::error::backup volume is not a separate filesystem"; exit 1; }
          backup_root="/mnt/toefl-house-backup/TOEFL-House-ERP-Backups"
          set_root="$backup_root/$backup_set"
          mkdir -p "$set_root"
          policy_json="$(printf '%s\n' "$policy_json" | tail -n 1)"
          python3 - "$backup_dir" "$set_root" "$backup_set" "$policy_json" <<'PY'
          import hashlib, json, os, shutil, sys
          from datetime import datetime, timezone
          source, destination, backup_set, policy_text = sys.argv[1:]
          policy = json.loads(policy_text)
          suffixes = {
              "database": "-database-enc.sql.gz",
              "public_files": "-files-enc.tar",
              "private_files": "-private-files-enc.tar",
              "recovery_config": "-site-config.gpg",
          }
          artifacts = []
          for role, suffix in suffixes.items():
              name = backup_set + suffix
              src, dst = os.path.join(source, name), os.path.join(destination, name)
              if not os.path.isfile(src) or os.path.islink(src):
                  raise SystemExit(f"missing/unsafe native encrypted artifact: {name}")
              shutil.copyfile(src, dst)
              def sha(path):
                  h = hashlib.sha256()
                  with open(path, "rb") as stream:
                      for block in iter(lambda: stream.read(1024 * 1024), b""):
                          h.update(block)
                  return h.hexdigest()
              digest = sha(src)
              if sha(dst) != digest or os.path.getsize(src) != os.path.getsize(dst):
                  raise SystemExit(f"secondary-volume copy verification failed: {name}")
              artifacts.append({"role": role, "name": name, "sha256": digest,
                                "bytes": os.path.getsize(dst)})
          if len(artifacts) != 4 or any("site_config_backup" in item["name"] for item in artifacts):
              raise SystemExit("backup set is incomplete or includes a plaintext site-config sidecar")
          created = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
          manifest = {
              "schema_version": 2, "backup_set": backup_set,
              "source_site": "toeflhouse.localhost",
              "source_drive": "C:", "backup_drive": "D:",
              "encrypted": True, "verified": True,
              "policy_hash": policy["policy_hash"],
              "recovery_key_sha256": policy["recovery_key_sha256"],
              "schedule_time": policy["schedule_time"],
              "retention_versions": policy["retention_versions"],
              "retention_behavior": policy["retention_behavior"],
              "artifacts": artifacts, "created_utc": created,
          }
          manifest_path = os.path.join(destination, "manifest.json")
          with open(manifest_path, "w", encoding="utf-8") as stream:
              json.dump(manifest, stream, sort_keys=True, separators=(",", ":"))
              stream.write("\n")
          receipt = {
              "schema_version": 1, "source_site": "toeflhouse.localhost",
              "source_drive": "C:", "backup_drive": "D:",
              "backup_root": os.path.dirname(destination),
              "backup_path": destination, "backup_set": backup_set,
              "created_utc": created, "encrypted": True, "verified": True,
              "automation_ready": True, "task_name": "TOEFL House ERP Backup",
              "schedule_time": policy["schedule_time"],
              "retention_versions": policy["retention_versions"],
              "retention_behavior": policy["retention_behavior"],
              "policy_hash": policy["policy_hash"],
              "recovery_key_sha256": policy["recovery_key_sha256"],
              "manifest_sha256": hashlib.sha256(open(manifest_path, "rb").read()).hexdigest(),
              "artifacts": artifacts,
          }
          with open("data/activation/backup-receipt.json", "w", encoding="utf-8") as stream:
              json.dump(receipt, stream, sort_keys=True, separators=(",", ":"))
              stream.write("\n")
          print("Four encrypted artifacts copied to a distinct mounted volume and SHA-256 verified")
          PY

          checkpoint="secondary-volume copy-back hash verification"
          # Copy the set back from the mounted secondary volume into the
          # disposable web container, then verify this second transfer before
          # the restore. The real Windows operator performs the analogous
          # separate-drive restore manually; this container copy is a CI model,
          # not Windows drive or Task Scheduler qualification.
          docker compose cp "$set_root" web:/tmp/
          restore_container_dir="/tmp/$backup_set"
          for name in "${encrypted_names[@]}" "$recovery_config_name"; do
            expected_hash="$(sha256sum "$set_root/$name" | cut -d' ' -f1)"
            actual_hash="$(docker compose exec -T web sha256sum "$restore_container_dir/$name" | cut -d' ' -f1)"
            test "$actual_hash" = "$expected_hash" || { echo "::error::secondary-volume restore staging hash mismatch: $name"; exit 1; }
            docker compose exec -T web cp -f -- "$restore_container_dir/$name" "sites/toeflhouse.localhost/private/backups/$name"
            return_hash="$(docker compose exec -T web sha256sum "sites/toeflhouse.localhost/private/backups/$name" | cut -d' ' -f1)"
            test "$return_hash" = "$expected_hash" || { echo "::error::verified backup return-to-site copy mismatch: $name"; exit 1; }
          done
          echo "::notice title=Secondary-volume copy::four artifacts copied back from the mounted secondary volume and reverified in the native site backup folder"

          checkpoint="database marker setup and encrypted restore"
          # Prove a real restore from the encrypted artifacts recovered from
          # the separate volume. The native key is recovered only by using the
          # runner-held private key on the GPG-encrypted site-config artifact.
          # A post-backup marker must disappear after restore.
          marker="ERP-RESTORE-REHEARSAL-${GITHUB_RUN_ID}"
          docker compose exec -T web /build/tools/bin/bench --site toeflhouse.localhost console <<PY
          import frappe
          marker = "$marker"
          doc = frappe.get_doc({"doctype": "ToDo", "description": marker, "status": "Open"})
          doc.insert(ignore_permissions=True)
          frappe.db.commit()
          print(marker)
          PY
          cred="$(docker compose exec -T -u root web cat /home/frappe/bench/sites/toeflhouse.localhost/private/first-run-credentials.txt)"
          admin_password="$(printf '%s\n' "$cred" | awk '/^Password: /{print $2}')"
          db_password="$(awk -F= '/^MARIADB_ROOT_PASSWORD=/{print $2}' data/secrets/db.env)"
          test -n "$admin_password" && test -n "$db_password"
          echo "::add-mask::$admin_password"
          echo "::add-mask::$db_password"
          checkpoint="clean public/private tree staging and Frappe restore"
          # Stop the serving process as well as all background writers before
          # touching the site files or replacing the database.
          docker compose stop web worker scheduler socketio
          # Frappe extracts file archives with tar into the existing file
          # directories; it does not remove post-backup extras. Stage the old
          # directories aside and restore into clean public/private targets so
          # this is a faithful file snapshot, not an overlay.
          site_root="data/sites/toeflhouse.localhost"
          restore_stage="$site_root/private/.ci-restore-files-$GITHUB_RUN_ID"
          mkdir -m 700 -p "$restore_stage"
          for scope in public private; do
            mkdir -p "$site_root/$scope"
            files_dir="$site_root/$scope/files"
            if [ -d "$files_dir" ]; then mv "$files_dir" "$restore_stage/$scope-files"; fi
            mkdir -p "$files_dir"
          done
          restore_start="$(date +%s)"
          # Serialize sensitive values to stdin; never place a password or
          # Frappe key in the Docker/Bench process argument list.
          RESTORE_SITE=toeflhouse.localhost \
          RESTORE_BACKUP_SET="$backup_set" \
          RESTORE_DB_ROOT_PASSWORD="$db_password" \
          RESTORE_ADMIN_PASSWORD="$admin_password" \
          RESTORE_ENCRYPTION_KEY="$backup_encryption_key" \
          python3 - <<'PY' | docker compose run --rm --no-deps -i -T \
            --entrypoint /home/frappe/bench/env/bin/python web /product/restore.py
          import json, os, sys
          json.dump({
              "site": os.environ["RESTORE_SITE"],
              "backup_set": os.environ["RESTORE_BACKUP_SET"],
              "db_root_password": os.environ["RESTORE_DB_ROOT_PASSWORD"],
              "admin_password": os.environ["RESTORE_ADMIN_PASSWORD"],
              "encryption_key": os.environ["RESTORE_ENCRYPTION_KEY"],
          }, sys.stdout)
          sys.stdout.write("\n")
          PY
          docker compose up -d --no-build
          for j in $(seq 1 60); do curl --fail --silent http://127.0.0.1:8000/ >/dev/null && break; sleep 2; done
          curl --fail --silent http://127.0.0.1:8000/ >/dev/null
          restore_elapsed="$(($(date +%s)-restore_start))"
          checkpoint="database and public/private file restore verification"
          marker_after="$(docker compose exec -T web /build/tools/bin/bench --site toeflhouse.localhost console <<PY
          import frappe
          print(bool(frappe.db.exists("ToDo", {"description": "$marker"})))
          PY
          )"
          printf '%s\n' "$marker_after" | grep -q '^False$'
          for scope in public private; do
            restored_file="$(docker compose exec -T web cat "sites/toeflhouse.localhost/$scope/files/product-image-restore-marker.txt")"
            test "$restored_file" = "$file_marker" || { echo "::error::${scope} file marker was not restored from the encrypted backup"; exit 1; }
          done
          rm -rf -- "$restore_stage"
          test "$restore_elapsed" -lt 28800
          echo "::notice title=Encrypted restore rehearsal::encrypted database, public/private file markers and Owner-key site-config recovery restored in ${restore_elapsed}s; post-backup database marker absent"

          checkpoint="site-mode activation, refusals and deactivation"
          act activate --confirm toeflhouse.localhost | tee activate.txt
          grep -q 'All gates passed' activate.txt
          act status | tee activated-status.txt
          grep -q 'Site operational mode: PRODUCTION' activated-status.txt
          grep -q 'Production authorization: REJECT' activated-status.txt
