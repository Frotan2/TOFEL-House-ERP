      - name: Browser UI acceptance (real headless Chromium, real login flow)
        # Container health, API calls and unit tests cannot prove the
        # operator actually sees a working UI. This drives a real headless
        # Chromium to the live site: the login page must render, the real
        # login (Administrator, from the first-run credentials file) must
        # complete through the login form, and the operator's desk must
        # actually render. The desk screenshot is uploaded as run evidence.
        working-directory: product
        run: |
          set -euo pipefail
          # The credentials file is 0600 and owned by the container's
          # service user (the product's security model), so - as in the
          # rehearsal step - it is read in-container as root and the
          # values are passed to the check via the environment.
          # The web can be briefly down (a loaded shared runner) right after
          # the previous step; retry the read with a bounded backoff and, if
          # it still fails, name the cause instead of dying bare under set -e
          # with no annotation.
          cred=""
          cred_ok=0
          for attempt in 1 2 3; do
              if cred="$(docker compose exec -T -u root web cat /home/frappe/bench/sites/toeflhouse.localhost/private/first-run-credentials.txt 2>&1)"; then
                  cred_ok=1
                  break
              fi
              echo "credentials read attempt $attempt failed; command output suppressed because it may contain credentials"
              sleep 10
          done
          if [ "$cred_ok" != "1" ]; then
              ps_out="$(docker compose ps 2>&1 || true)"
              echo "::error::first-run credentials read failed after 3 attempts; command output suppressed because it may contain credentials"
              echo "::error::stack states::${ps_out:0:800}"
              exit 1
          fi
          cred_user="$(printf '%s\n' "$cred" | awk '/^Username: /{print $2}')"
          cred_password="$(printf '%s\n' "$cred" | awk '/^Password: /{print $2}')"
          if [ -z "$cred_user" ] || [ -z "$cred_password" ]; then
              echo "::error::first-run credentials file is missing its Username or Password line"
              exit 1
          fi
          echo "::add-mask::$cred_password"
          if [ "$cred_user" != "Administrator" ]; then
              echo "::error::first-run credentials user is not Administrator: $cred_user"
              exit 1
          fi
          # Asset probes: the login page is server-rendered, but its web client
          # (the frappe global the inlined login handler needs) is a built
          # bundle. Show exactly which assets the served page references and
          # whether each answers, so a missing bundle is visible plainly.
          # The grep is pipefail-proof: a page that references no /assets at
          # all must hit the friendly diagnostic below, not a silent exit 1.
          login_html="$(curl --fail --silent --location http://127.0.0.1:8000/)" || {
              # A dead page must not die silently: show its status and body.
              page_code="$(curl --silent -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:8000/ || true)"
              page_snippet="$(curl --silent --max-time 10 http://127.0.0.1:8000/ 2>&1 || true)"
              echo "::error::login page fetch failed (HTTP ${page_code:-no response})::${page_snippet:0:400}"
              exit 1
          }
          asset_list="$(printf "%s" "$login_html" | tr '"' '\n' | { grep -E '^/assets/[a-zA-Z0-9_./-]+\.(js|css)$' || true; } | sort -u)"
          if [ -z "$asset_list" ]; then
              # Bash substring, not a pipe: head -c on a long page can SIGPIPE
              # printf and kill the diagnostic under pipefail.
              page_start="${login_html:0:500}"
              page_start="${page_start//$'\n'/ }"
              echo "::error::login page references no /assets/ scripts or styles at all"
              echo "::error::page start::${page_start}"
          fi
          test -n "$asset_list"
          printf "%s\n" "$asset_list" | while IFS= read -r asset; do
              code="$(curl --silent -o /dev/null -w "%{http_code}" "http://127.0.0.1:8000$asset")"
              echo "asset ${code} ${asset}"
              if [ "$code" != "200" ]; then
                  echo "::error::login page asset ${code}: ${asset}"
                  relative_asset="${asset#/assets/}"
                  asset_debug="$(docker compose exec -T -w /home/frappe/bench/sites -e PYTHONPATH=/product web /home/frappe/bench/env/bin/python - "$relative_asset" <<'PY' 2>&1 || true
          import json, pathlib, re, sys, urllib.error, urllib.request
          relative = sys.argv[1]
          if (not re.fullmatch(r"[A-Za-z0-9_./-]+", relative)
                  or any(part in {"", ".", ".."} for part in relative.split("/"))):
              print("asset_path=invalid")
              raise SystemExit(0)
          try:
              import wsgi
          except Exception as error:
              name = type(error).__name__
              if not re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]{0,63}", name):
                  name = "Exception"
              print("wsgi_import=failed:" + name)
              code = getattr(error, "errno", None)
              if type(code) is int and 0 <= code <= 255:
                  print("wsgi_import_errno=" + str(code))
              import traceback
              frames = traceback.extract_tb(error.__traceback__)
              safe_frames = [
                  f"{pathlib.PurePath(frame.filename).name}:{frame.name}:{frame.lineno}"
                  for frame in frames[-4:]
              ]
              if safe_frames:
                  print("wsgi_import_frames=" + ",".join(safe_frames))
              raise SystemExit(0)
          root = pathlib.Path(wsgi.sites_path)
          asset_root = root / "assets"
          target = asset_root.joinpath(*relative.split("/"))
          print("wsgi_import=ok")
          print("static_root_exists=" + str(asset_root.is_dir()).lower())
          print("static_root_is_symlink=" + str(asset_root.is_symlink()).lower())
          print("asset_exists=" + str(target.is_file()).lower())
          print("asset_is_symlink=" + str(target.is_symlink()).lower())
          parts = relative.split("/")
          app, app_path = parts[0], parts[1:]
          app_root = pathlib.Path("/home/frappe/bench/apps") / app
          public_candidates = (
              app_root / app / "public" / pathlib.Path(*app_path),
              app_root / "public" / pathlib.Path(*app_path),
          )
          print("asset_source_nested_exists=" + str(public_candidates[0].is_file()).lower())
          print("asset_source_top_level_exists=" + str(public_candidates[1].is_file()).lower())
          print("asset_app_root_is_symlink=" + str((asset_root / app).is_symlink()).lower())
          try:
              mappings = json.loads((asset_root / "assets.json").read_text(encoding="utf-8"))
              manifest_matches = (isinstance(mappings, dict)
                                  and "/assets/" + relative in mappings.values())
          except (OSError, UnicodeError, json.JSONDecodeError):
              manifest_matches = False
          print("asset_manifest_matches=" + str(manifest_matches).lower())
          try:
              with urllib.request.urlopen(
                      "http://127.0.0.1:8000/assets/" + relative, timeout=10) as response:
                  print("container_asset_http=" + str(response.status))
          except urllib.error.HTTPError as error:
              print("container_asset_http=" + str(error.code))
          except Exception:
              print("container_asset_http=no-response")
          PY
          )"
                  while IFS= read -r debug_line; do
                    case "$debug_line" in
                      asset_path=invalid|wsgi_import=*|wsgi_import_errno=*|wsgi_import_frames=*|static_root_exists=*|static_root_is_symlink=*|asset_exists=*|asset_is_symlink=*|asset_source_nested_exists=*|asset_source_top_level_exists=*|asset_app_root_is_symlink=*|asset_manifest_matches=*|container_asset_http=*)
                        echo "::error title=Asset route diagnostic::${debug_line}"
                        ;;
                    esac
                  done <<< "$asset_debug"
                  exit 1
              fi
              test "$code" = "200"
          done
          cat > browser_ui_check.py <<'PYEOF'
          import os, pathlib, sys, traceback
          def _ci_excepthook(typ, value, tb):
              lineno = tb.tb_lineno if tb else -1
              traceback.print_exception(typ, value, tb)
              print("::error::browser UI acceptance failed at line %s: %s" % (lineno, value))
          sys.excepthook = _ci_excepthook
          import playwright.sync_api as pw

          user = os.environ["BROWSER_UI_USER"]
          password = os.environ["BROWSER_UI_PASSWORD"]
          assert user == "Administrator"

          shot = pathlib.Path("browser-ui-evidence.png")
          console_errors, page_errors, failed_requests = [], [], []
          with pw.sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width": 1440, "height": 900})
              page.on("console", lambda m: console_errors.append(m.text) if m.type == "error" else None)
              page.on("pageerror", lambda e: page_errors.append(str(e)))
              page.on("requestfailed", lambda r: failed_requests.append(f"{r.url} {r.failure}"))
              page.goto("http://127.0.0.1:8000/", wait_until="domcontentloaded", timeout=120_000)
              # Frappe v16 login form fields (frappe/www/login.html at the
              # pinned commit): id=login_email / id=login_password, submit
              # button .btn-login[type=submit].
              page.wait_for_selector("#login_email", timeout=60_000)   # real login form, not an error page
              page.wait_for_selector("#login_password", timeout=60_000)
              page.fill("#login_email", user)
              page.fill("#login_password", password)
              page.screenshot(path=str(shot))
              # The inlined login handler needs the frappe web client (the built
              # bundle); if it never loads, fail here with a screenshot.
              try:
                  page.wait_for_function(
                      "typeof frappe !== 'undefined' && typeof frappe.call === 'function'",
                      timeout=30_000)
              except Exception:
                  page.screenshot(path=str(shot))
                  raise
              page.click("button.btn-login[type=submit]")
              try:
                  # v16 desk lives at /desk (not /app); a fresh site routes the
                  # first login through the native setup wizard, which is still
                  # the authenticated post-login surface.
                  page.wait_for_url("**/desk**", timeout=90_000)
              except Exception:
                  # Self-diagnosis: what the page itself says right now, plus the
                  # JS-level errors, so a red step carries its own cause.
                  def texts(sel):
                      try:
                          return [e.inner_text().strip() for e in page.query_selector_all(sel) if e.inner_text().strip()]
                      except Exception:
                          return []
                  parts = [f"url={page.url}"]
                  parts += [f"field-error: {t}" for t in texts(".field-error")]
                  parts += [f"banner: {t}" for t in texts(".login-error-banner span")]
                  parts += [f"console: {t}" for t in console_errors[-10:]]
                  parts += [f"pageerror: {t}" for t in page_errors[-5:]]
                  parts += [f"req-failed: {t}" for t in failed_requests[-10:]]
                  parts.append(f"body-snippet: {page.inner_text('body')[:300]!r}")
                  page.screenshot(path=str(shot))
                  print("::error::browser UI diagnosis::" + " | ".join(parts))
                  raise
              page.wait_for_timeout(5_000)                      # let the desk shell render
              assert page.url.startswith("http://127.0.0.1:8000/desk"), page.url
              assert page.query_selector("#login_password") is None, "login form still present after login"
              assert len(page.inner_text("body").strip()) > 200, "desk rendered no content"
              page.screenshot(path=str(shot))
              browser.close()
          print("::notice title=Browser UI::real Chromium: login page -> real login -> authenticated desk surface (screenshot kept)")
          PYEOF
          # A dedicated venv keeps the browser tooling hermetic: the
          # runner's system python is externally managed, and a plain
          # `pip install` there does not reliably land on the running
          # interpreter's import path (observed: pip exit 0, then
          # "No module named 'playwright'", 2026-10-06).
          python3 ../tools/foundation/annotated_step.py "Browser UI: hermetic venv" -- python3 -m venv /tmp/browser-ui-venv
          python3 ../tools/foundation/annotated_step.py "Browser UI: playwright install" -- /tmp/browser-ui-venv/bin/python -m pip install --quiet playwright
          python3 ../tools/foundation/annotated_step.py "Browser UI: chromium install" -- /tmp/browser-ui-venv/bin/python -m playwright install --with-deps chromium
          BROWSER_UI_USER="$cred_user" BROWSER_UI_PASSWORD="$cred_password" \
            python3 ../tools/foundation/annotated_step.py "Browser UI: live check" -- /tmp/browser-ui-venv/bin/python browser_ui_check.py
      - name: Keep browser UI evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
