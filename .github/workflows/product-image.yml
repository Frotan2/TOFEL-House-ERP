name: Product image

# Builds the desktop application image exactly as the owner's machine does
# (product/app.Dockerfile via product/docker-compose.yml) and validates the
# compose file, then boots the stack and runs the Owner's Backup and one-time
# activation/deactivation commands against the real site (product/activate.py).
on:
  push:
    paths:
      - .github/workflows/product-image.yml
      - product/**
      - apps/**
      - docs/engineering/foundation-version-matrix.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Validate compose file
        # db.env is generated per machine by the Windows installer; CI uses a
        # throwaway value only to let compose resolve the env_file.
        run: |
          mkdir -p product/data/secrets
          printf 'MARIADB_ROOT_PASSWORD=%s\n' "$(openssl rand -hex 24)" > product/data/secrets/db.env
          docker compose -f product/docker-compose.yml config --quiet
      - name: Node tarball integrity (official nodejs.org SHASUMS256)
        # Resolves the published sha256 of the exact Node tarball the Dockerfile
        # downloads. If the matrix carries a pin, any upstream drift fails the
        # build here, before anything is compiled; the live value is what the
        # build verifies.
        run: |
          set -euo pipefail
          node_version=$(python3 -c "
          import json
          matrix = json.load(open('docs/engineering/foundation-version-matrix.json'))
          print(next(c['selected_version'] for c in matrix['components'] if c['name'] == 'node'))
          ")
          curl -fsSL "https://nodejs.org/dist/v${node_version}/SHASUMS256.txt" -o /tmp/node-shasums.txt
          live=$(grep -E " node-v${node_version}-linux-x64\.tar\.xz\$" /tmp/node-shasums.txt | awk '{print $1}')
          test -n "$live"
          pinned=$(python3 -c "
          import json
          matrix = json.load(open('docs/engineering/foundation-version-matrix.json'))
          print(next(c.get('tarball_sha256', '') for c in matrix['components'] if c['name'] == 'node'))
          ")
          if [ -n "$pinned" ] && [ "$pinned" != "$live" ]; then
            echo "::error::Node tarball sha256 drift: matrix pins ${pinned}, nodejs.org publishes ${live}"
            exit 1
          fi
          echo "NODE_TARBALL_SHA256=${live}" >> "$GITHUB_ENV"
          if [ -n "$pinned" ]; then
            echo "::notice title=Node tarball::v${node_version} linux-x64 sha256 ${live} (matrix pin verified)"
          else
            echo "::notice title=Node tarball::v${node_version} linux-x64 sha256 ${live} (recorded; matrix pin pending)"
          fi
      - name: Record base image resolved digest
        # The Python base image is pinned by exact patch tag; the registry's
        # resolved digest for that tag is recorded per build so the pin's
        # actual content is traceable (the tag is immutable once published).
        run: |
          set -euo pipefail
          base=$(python3 -c "
          import json
          matrix = json.load(open('docs/engineering/foundation-version-matrix.json'))
          print('python:' + next(c['selected_version'] for c in matrix['components'] if c['name'] == 'python') + '-slim-bookworm')
          ")
          digest=$(docker buildx imagetools inspect "$base" 2>/dev/null | grep -m1 -oE 'sha256:[0-9a-f]{64}' || true)
          echo "::notice title=Base image digest::${base} -> ${digest:-not resolvable from this runner}"
      - name: Build application image
        run: docker build --build-arg NODE_TARBALL_SHA256="${NODE_TARBALL_SHA256}" -f product/app.Dockerfile -t toefl-house-erp-app:ci -t toefl-house-erp-app:local .
      - name: Report image footprint
        run: |
          set -euo pipefail
          size() { docker image inspect "$1" --format '{{.Size}}' | awk '{printf "%.0f MB", $1/1000000}'; }
          echo "::notice title=Image size::toefl-house-erp-app $(size toefl-house-erp-app:ci)"
          layers=$(docker history --format '{{.Size}} {{.CreatedBy}}' toefl-house-erp-app:ci | grep -v '^0B' | cut -c1-90 | head -12 | paste -sd'|' -)
          echo "::notice title=Largest layers::${layers}"
          usage=$(docker run --rm --entrypoint sh toefl-house-erp-app:ci -c 'du -sm /home/frappe/bench/env /home/frappe/bench/apps/* /build/sources /build/owned /build/tools /usr/local /usr/lib /home/frappe/.cache 2>/dev/null | sort -rn' | awk '{print $1"MB "$2}' | paste -sd'|' -)
          echo "::notice title=Disk usage in image::${usage}"
      - name: First boot, backup and Owner activation on the real product stack
        working-directory: product
        run: |
          set -euo pipefail
          mkdir -p data/sites data/logs && chmod 777 data/sites data/logs
          docker compose up -d --no-build
          for i in $(seq 1 300); do curl --fail --silent http://127.0.0.1:8000/ >/dev/null && break; sleep 10; done
          curl --fail --silent http://127.0.0.1:8000/ >/dev/null
          echo "::notice title=First boot::site answered after ~$((i*10))s"
          act() { docker compose exec -T web /product/activate.py "$@"; }
          act status | tee status.txt; grep -q ': REFUSED' status.txt
          set +e; act activate --confirm toeflhouse.localhost; rc=$?; set -e
          test "$rc" = 2  # refused: no backup yet
          docker compose exec -T web /build/tools/bin/bench --site toeflhouse.localhost backup --with-files
          act activate --confirm toeflhouse.localhost | tee activate.txt
          grep -q 'All gates passed' activate.txt
          act status | grep -q ': PRODUCTION'
          set +e; act fee-item --confirm toeflhouse.localhost NO-SUCH-ITEM; rc=$?; set -e
          test "$rc" = 2  # refused: Item must already exist natively
          act deactivate --confirm toeflhouse.localhost
          act status | grep -q ': REFUSED'
          echo "::notice title=Owner activation::REFUSED -> backup gate -> PRODUCTION (all gates) -> fee-item refusal -> REFUSED"
      - name: Multi-user tailnet contract (second client, no public exposure, restart persistence)
        # The owner deployment (D13/D15) is one central PC plus authorized
        # staff PCs over a Tailscale tailnet (runbook section 9). Tailscale
        # itself is external to the product, so this step proves the product
        # contract that makes the tailnet setup work:
        #   * a second, non-administrator client authenticates and uses the ERP
        #   * a tailnet-style proxy (foreign Host + X-Forwarded-Proto) serves
        #     the same site — the hostname the tailnet presents is arbitrary
        #   * nothing is published outside the host loopback
        #   * a full restart recovers every service and the data
        working-directory: product
        run: |
          set -euo pipefail
          # Every stage appends to tailnet-progress.txt (truncated at step
          # start); the on-failure step prints it, so the last stage
          # reached — and any failing command's output — always survives
          # the capped annotation view.
          > tailnet-progress.txt
          echo "stage: staff-user exec start" >> tailnet-progress.txt
          staff_out=$(docker compose exec -T -i web /home/frappe/bench/env/bin/python3 - <<'EOF'
          import sys
          import traceback
          def _ci_excepthook(typ, value, tb):
              lineno = tb.tb_lineno if tb else -1
              traceback.print_exception(typ, value, tb)
              print("::error::tailnet staff-user setup failed at line %s: %s" % (lineno, value))
          sys.excepthook = _ci_excepthook
          # Frappe's database logger opens the CWD-relative "../logs/<name>.log"
          # (frappe.utils.logger.create_handler). Gunicorn runs from
          # bench/sites so that resolves to bench/logs; an exec inherits the
          # container WORKDIR (bench) and would open ../logs outside the
          # mounted logs directory. Run from sites, like every bench command.
          import os
          os.chdir("/home/frappe/bench/sites")
          import frappe
          frappe.init(site="toeflhouse.localhost", sites_path="/home/frappe/bench/sites")
          frappe.connect()
          user = "staff-a@example.test"
          if not frappe.db.exists("User", user):
              doc = frappe.new_doc("User")
              doc.email = user
              doc.first_name = "Staff"
              doc.last_name = "A"
              doc.send_welcome_email = 0
              doc.new_password = "staff-a-ci-123"
              doc.add_roles("Reception")
              doc.save(ignore_permissions=True)
          frappe.db.commit()
          print("staff user ready")
          EOF
          ) && staff_rc=0 || staff_rc=$?
          if [ "$staff_rc" -ne 0 ]; then
            echo "stage: staff-user exec FAILED rc=$staff_rc" >> tailnet-progress.txt
            printf 'exec output:\n%s\n' "$staff_out" >> tailnet-progress.txt
            exit 1
          fi
          echo "stage: staff-user exec OK" >> tailnet-progress.txt
          printf 'exec output:\n%s\n' "$staff_out" >> tailnet-progress.txt
          echo "$staff_out" | grep -q "staff user ready"
          # The first-run credentials file is 0600 and owned by the
          # container's service user (bootstrap writes it for the owner),
          # so the host runner user cannot read it directly. Read it
          # in-container as root — the product's own permission model —
          # and keep the value in a shell variable that is never echoed.
          admin_cred=$(docker compose exec -T -u root web cat /home/frappe/bench/sites/toeflhouse.localhost/private/first-run-credentials.txt)
          test -n "$admin_cred"
          echo "stage: admin credentials read (in-container root)" >> tailnet-progress.txt
          TAILNET_ADMIN_PW="$admin_cred" python3 - <<'EOF'
          import json
          import os
          import subprocess
          import urllib.error
          import urllib.parse
          import urllib.request

          # CI log lines are only reachable as run annotations; make any
          # uncaught failure carry its line number into the annotation set.
          import sys
          import traceback
          def _ci_excepthook(typ, value, tb):
              lineno = tb.tb_lineno if tb else -1
              traceback.print_exception(typ, value, tb)
              print("::error::tailnet contract failed at line %s: %s" % (lineno, value))
          sys.excepthook = _ci_excepthook
          open("tailnet-progress.txt", "a").write("stage: python contract start\n")

          BASE = "http://127.0.0.1:8000"

          # CI annotations are a capped, lossy view of the step log; every
          # stage also appends to a progress file that the on-failure step
          # prints, so the last stage reached is always recoverable.
          def progress(stage):
              print("T-SITE " + stage, flush=True)
              with open("tailnet-progress.txt", "a") as fh:
                  fh.write(stage + "\n")

          def call(path, *, data=None, headers=None, host=None, session=None):
              url = BASE + path
              body = None
              hdrs = dict(headers or {})
              if host:
                  hdrs["Host"] = host
              if session:
                  hdrs["Cookie"] = "sid=" + session
              if data is not None:
                  body = urllib.parse.urlencode(data).encode()
              request = urllib.request.Request(url, data=body, headers=hdrs)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      text = response.read().decode()
                      cookies = response.headers.get_all("Set-Cookie") or []
                      return response.status, text, cookies
              except urllib.error.HTTPError as error:
                  return error.code, error.read().decode(), []

          LOGIN_DIAG = []

          def login(username, password, host=None):
              status, text, cookies = call("/api/method/login",
                                           data={"usr": username, "pwd": password}, host=host)
              assert status == 200, (status, text[:200])
              payload = json.loads(text)
              assert "exc_info" not in payload, payload
              # A 200 without a sid cookie is a frappe challenge/refusal
              # ("Login Failed", "Password Reset", ...); surface it instead
              # of dying in next() with a bare StopIteration.
              sids = [c for c in cookies if c.startswith("sid=")]
              assert sids, ("login returned no sid cookie", status, text[:300], cookies)
              LOGIN_DIAG.append((username, status, text[:300],
                                 [c[:40] for c in cookies]))
              return sids[0].split(";", 1)[0]

          def session_diag(sid):
              # The staff session is resolved by the web worker from the
              # tabSessions table / redis session cache; probe both from
              # inside the container so a guest-fallback failure is
              # self-explaining (row present? cache entry? which user?).
              try:
                  probe = subprocess.check_output(
                      ["docker", "compose", "exec", "-T", "-i", "-u", "root",
                       "-e", "PROBE_SID", "web",
                       "/home/frappe/bench/env/bin/python3", "-"],
                      input="import os, json\n"
                      "os.chdir('/home/frappe/bench/sites')\n"
                      "import frappe\n"
                      "frappe.init(site='toeflhouse.localhost', sites_path='/home/frappe/bench/sites')\n"
                      "frappe.connect()\n"
                      "sid = os.environ.get('PROBE_SID', 'MISSING')\n"
                      "rows = frappe.db.sql('select sid,user,status,lastupdate from `tabSessions` order by lastupdate desc limit 5', as_dict=True)\n"
                      "out = {'probe_sid': sid[:8] + '...len=' + str(len(sid)), 'db_sessions': rows}\n"
                      "out['conf'] = {k: frappe.conf.get(k) for k in ('redis_cache','redis_queue','use_redis_for_cache','use_redis_for_sessions','db_name','db_host','db_port')}\n"
                      "try:\n"
                      "    cached = frappe.cache.hget('session', sid)\n"
                      "    out['cache_hit'] = bool(cached)\n"
                      "    out['cache_user'] = (cached or {}).get('data', {}).get('user')\n"
                      "except Exception as e:\n"
                      "    out['cache_error'] = repr(e)\n"
                      "print('SESSIONS-DIAG ' + json.dumps(out, default=str))\n",
                      text=True, env={**os.environ, "PROBE_SID": sid}, timeout=120)
                  print("::error::" + probe.strip()[:2500], flush=True)
                  with open("tailnet-progress.txt", "a") as fh:
                      fh.write("SESSIONS-DIAG " + probe.strip()[:2500] + "\n")
              except Exception as e:
                  print("::error::session probe failed: %r" % e, flush=True)
                  with open("tailnet-progress.txt", "a") as fh:
                      fh.write("session probe failed: %r\n" % e)

          progress("admin password present: %s" % ("yes" if os.environ.get("TAILNET_ADMIN_PW") else "no"))
          admin_pw = os.environ["TAILNET_ADMIN_PW"]
          staff_pw = "staff-a-ci-123"
          progress("staff login start")
          staff = login("staff-a@example.test", staff_pw)
          progress("staff login OK: " + repr(LOGIN_DIAG[-1][2])[:220])
          session_diag(staff)

          # (1) The second client authenticates and uses the ERP.
          status, text, _ = call("/api/method/toefl_house.desk.reception.work", session=staff)
          assert status == 200 and "exc_info" not in json.loads(text), (
              "staff desk call refused", status, text[:400],
              "logins=%r" % LOGIN_DIAG)
          # Session isolation: the staff session cannot reach an admin-only surface.
          status, text, _ = call("/api/method/toefl_house.administration.get_control_center_snapshot",
                                 data={}, session=staff)
          payload = json.loads(text)
          assert "PermissionError" in text or status != 200, "staff session reached an admin-only endpoint"
          progress("second client: desk OK, admin surface denied")
          print("second client: authenticated desk access OK; admin surface denied OK")

          # (2) Tailnet proxy contract: a foreign Host with forwarded-https
          # must serve the same site (wsgi.py pins the site, so the hostname
          # the tailnet presents is irrelevant to the product).
          tailnet = "erp.toeflhouse.example"
          status, text, _ = call("/login", host=tailnet,
                                 headers={"X-Forwarded-Proto": "https"})
          assert status == 200 and "Password" in text, (status, text[:200])
          tailnet_sid = login("staff-a@example.test", staff_pw, host=tailnet)
          status, text, _ = call("/api/method/toefl_house.desk.reception.work",
                                 session=tailnet_sid, host=tailnet,
                                 headers={"X-Forwarded-Proto": "https"})
          assert status == 200 and "exc_info" not in json.loads(text), text[:300]
          progress("tailnet proxy: foreign-host login and desk OK")
          print("tailnet proxy: foreign-host login and desk OK")

          # (3) No public exposure: compose publishes loopback only and the
          # host listens on loopback only.
          compose = json.loads(subprocess.check_output(
              ["docker", "compose", "config", "--format", "json"], text=True))
          published = [p for service in compose["services"].values()
                       for p in (service.get("ports") or [])]
          assert published, "compose declares no published ports"
          for entry in published:
              assert entry["hostIP"] in ("127.0.0.1", "localhost"), entry
          # ss -ltn columns: Netid State Recv-Q Send-Q Local Address:Port Peer
          # (the local address is the fifth field; the fourth is Send-Q).
          listeners = subprocess.check_output(
              ["ss", "-ltn"], text=True).splitlines()
          for line in listeners:
              if any((":" + port) in line for port in ("8000", "9000")):
                  assert line.split()[4].startswith("127.0.0.1"), line
          external = subprocess.check_output(["hostname", "-i"], text=True).split()[0]
          try:
              urllib.request.urlopen("http://%s:8000/" % external, timeout=5)
              raise AssertionError("port 8000 answers on the non-loopback interface")
          except urllib.error.HTTPError:
              raise AssertionError("port 8000 answers on the non-loopback interface")
          except (urllib.error.URLError, ConnectionRefusedError, OSError):
              pass  # connection refused: exactly what loopback-only means
          progress("no public exposure: loopback-only publish and listen OK")
          print("no public exposure: loopback-only publish and listen OK")

          # (4) Restart persistence: a marker record, a full restart, every
          # service back (worker/scheduler/socketio included), data intact.
          progress("marker record insert start")
          subprocess.run(["docker", "compose", "exec", "-T", "web",
                          "/home/frappe/bench/env/bin/python3", "-c",
                          "import os; os.chdir('/home/frappe/bench/sites'); "
                          "import frappe; frappe.init(site='toeflhouse.localhost', sites_path='/home/frappe/bench/sites'); "
                          "frappe.connect(); "
                          "if not frappe.db.exists('Student', {'first_name': 'Tailnet', 'last_name': 'Marker'}): "
                          "frappe.get_doc({'doctype': 'Student', 'first_name': 'Tailnet', 'last_name': 'Marker', 'student_email_id': 'tailnet-marker@example.test'}).insert(ignore_permissions=True); "
                          "frappe.db.commit()"], check=True)
          progress("marker record inserted")
          progress("full restart start")
          subprocess.run(["docker", "compose", "restart"], check=True)
          progress("full restart issued")
          import time
          for _ in range(120):
              try:
                  urllib.request.urlopen(BASE + "/", timeout=5)
                  break
              except Exception:
                  time.sleep(5)
          else:
              raise AssertionError("site did not answer after restart")
          progress("site answered after restart")
          # compose v2 emits either a JSON array or one object per line
          # (NDJSON) depending on the version; accept both.
          raw = subprocess.check_output(
              ["docker", "compose", "ps", "--format", "json"], text=True).strip()
          print("T-SITE compose ps raw: " + raw[:400].replace("\n", " | "), flush=True)
          states = json.loads(raw) if raw.startswith("[") else [
              json.loads(line) for line in raw.splitlines() if line.strip()]
          names = sorted(item["Name"] for item in states)
          running = {item["Name"] for item in states if item.get("State") == "running"}
          missing = set(names) - running
          progress("ps parsed: %d services, missing=%s" % (len(names), sorted(missing)))
          assert not missing, "services not running after restart: %s" % missing
          # After a full restart the web can answer before the database is
          # back; the logins (which query the DB) therefore retry briefly.
          def login_retry(username, password, tries=12):
              last = None
              for _ in range(tries):
                  try:
                      return login(username, password)
                  except AssertionError as exc:
                      last = exc
                      print("T-SITE login retry %s: %s" % (username, exc), flush=True)
                      time.sleep(5)
              raise last
          progress("admin login start")
          admin2 = login_retry("Administrator", admin_pw)
          progress("admin login OK")
          status, text, _ = call("/api/method/frappe.client.get_count",
                                 data={"doctype": "Student"}, session=admin2)
          payload = json.loads(text)
          assert int(payload.get("count", 0)) >= 1, payload
          progress("student count OK: %s" % payload.get("count"))
          staff2 = login_retry("staff-a@example.test", staff_pw)
          status, text, _ = call("/api/method/toefl_house.desk.reception.work", session=staff2)
          assert status == 200 and "exc_info" not in json.loads(text), text[:300]
          progress("restart persistence verified")
          print("restart persistence: %d services running, data and access intact" % len(names))
          EOF
          echo "::notice title=Multi-user tailnet contract::second client + tailnet proxy + loopback-only exposure + restart persistence"
      - name: Upgrade/rollback rehearsal (backup -> rebuild -> migrate -> verify -> restore -> verify)
        # P1 #8: the upgrade/rollback path is proven on the real product
        # stack by rehearsing the owner's own procedure:
        #   backup   the exact command the Windows Backup script runs
        #   rebuild  image rebuild + full container redeploy (volumes intact)
        #   migrate  bench migrate, the migration phase of every ERP upgrade
        #   verify   data and the production activation survive the redeploy
        #   restore  the runbook section-10 restore of the backup triplet
        #   verify   data is exactly at the backup point (the record written
        #            after the backup is rolled back; the pre-backup record
        #            is intact) and the site is healthy again
        working-directory: product
        run: |
          set -euo pipefail
          act() { docker compose exec -T web /product/activate.py "$@"; }
          site=data/sites/toeflhouse.localhost
          backup_dir=$site/private/backups

          # (0) The rehearsal targets the site the owner would upgrade: an
          # activated production site (the first-boot step ended in REFUSED
          # after proving deactivation; activation is a reversible site
          # config, and the rehearsal re-proves the gate end to end).
          act status | grep -q ': REFUSED'
          act activate --confirm toeflhouse.localhost | tee rehearse-activate.txt
          grep -q 'All gates passed' rehearse-activate.txt
          act status | grep -q ': PRODUCTION'
          echo "::notice title=Rehearsal start::site re-activated to PRODUCTION"

          # (1) BACKUP: the owner's exact backup command.
          before=$(ls "$backup_dir"/*-database.sql.gz 2>/dev/null | wc -l)
          docker compose exec -T web /build/tools/bin/bench --site toeflhouse.localhost backup --with-files
          after=$(ls "$backup_dir"/*-database.sql.gz 2>/dev/null | wc -l)
          test $((after - before)) = 1
          triple_base=$(ls -t "$backup_dir" | grep -- '-database\.sql\.gz$' | head -1)
          triple_base=${triple_base%-database.sql.gz}
          test -f "$backup_dir/${triple_base}-files.tar"
          test -f "$backup_dir/${triple_base}-private-files.tar"
          echo "::notice title=Rehearsal backup::triplet ${triple_base}"

          # (2) REBUILD: rebuild the application image (cached: same source)
          # and redeploy every container; the data volumes are untouched -
          # exactly what a software update does on the owner's machine.
          docker compose build
          docker compose up -d --force-recreate
          for i in $(seq 1 180); do curl --fail --silent http://127.0.0.1:8000/ >/dev/null && break; sleep 5; done
          curl --fail --silent http://127.0.0.1:8000/ >/dev/null
          echo "::notice title=Rehearsal rebuild::stack redeployed after ~$((i*5))s"

          # (3) MIGRATE: the upgrade's migration phase (the boot entrypoint
          # already ran one; the explicit run is the command the owner's
          # upgrade performs).
          docker compose exec -T web /build/tools/bin/bench --site toeflhouse.localhost migrate
          echo "::notice title=Rehearsal migrate::bench migrate OK"

          # (4) VERIFY: pre-backup data and the production activation
          # survived the redeploy; then a post-backup record that the
          # restore must roll back. (exec -i + marker assertion: a
          # script that never ran must never count as verified.)
          verify1=$(docker compose exec -T -i web /home/frappe/bench/env/bin/python3 - <<'EOF'
          import sys
          import traceback
          def _ci_excepthook(typ, value, tb):
              lineno = tb.tb_lineno if tb else -1
              traceback.print_exception(typ, value, tb)
              print("::error::rehearsal verify#1 failed at line %s: %s" % (lineno, value))
          sys.excepthook = _ci_excepthook
          # Run from bench/sites: frappe's database logger opens the
          # CWD-relative ../logs/<name>.log (see the tailnet staff-user
          # setup above); an exec inherits the container WORKDIR (bench).
          import os
          os.chdir("/home/frappe/bench/sites")
          import frappe
          frappe.init(site="toeflhouse.localhost", sites_path="/home/frappe/bench/sites")
          frappe.connect()
          assert frappe.db.exists("Student", {"first_name": "Tailnet", "last_name": "Marker"}), \
              "pre-backup marker student lost in the redeploy"
          email = "upgrade-probe@example.test"
          if not frappe.db.exists("Student", {"student_email_id": email}):
              frappe.get_doc({"doctype": "Student", "first_name": "Upgrade", "last_name": "Probe",
                              "student_email_id": email}).insert(ignore_permissions=True)
              frappe.db.commit()
          assert frappe.db.exists("Student", {"student_email_id": email})
          print("verify#1: pre-backup data intact; post-backup probe record created")
          EOF
          )
          echo "$verify1" | grep -q "verify#1: pre-backup data intact"
          act status | grep -q ': PRODUCTION'
          echo "::notice title=Rehearsal verify 1::data and production activation intact after redeploy + migrate"

          # (5) RESTORE: runbook section 10, as the rehearsal proved it. The
          # restore runs in the running web container (the stack cannot be
          # down: exec needs the container, and CI has no concurrent
          # writers); paths are relative to the bench directory inside the
          # container, which is where bench resolves them from.
          # The credentials file is 0600 and owned by the container's
          # service user; read it in-container as root (see the tailnet
          # step). db.env is host-generated and host-readable.
          admin_pw=$(docker compose exec -T -u root web cat /home/frappe/bench/sites/toeflhouse.localhost/private/first-run-credentials.txt | awk '/^Password: /{print $2}')
          db_root_pw=$(awk -F= '/^MARIADB_ROOT_PASSWORD=/{print $2}' data/secrets/db.env)
          test -n "$admin_pw"
          test -n "$db_root_pw"
          docker compose exec -T web /build/tools/bin/bench --site toeflhouse.localhost \
            restore "sites/toeflhouse.localhost/private/backups/${triple_base}-database.sql.gz" \
            --with-public-files "sites/toeflhouse.localhost/private/backups/${triple_base}-files.tar" \
            --with-private-files "sites/toeflhouse.localhost/private/backups/${triple_base}-private-files.tar" \
            --db-root-password "$db_root_pw" --admin-password "$admin_pw"
          docker compose restart web
          for i in $(seq 1 180); do curl --fail --silent http://127.0.0.1:8000/ >/dev/null && break; sleep 5; done
          curl --fail --silent http://127.0.0.1:8000/ >/dev/null
          echo "::notice title=Rehearsal restore::triplet ${triple_base} restored, web restarted"

          # (6) VERIFY: the data is exactly at the backup point - the
          # pre-backup record is present, the post-backup record is gone -
          # and the site is healthy in production mode. (exec -i + marker
          # assertion, as in verify#1.)
          verify2=$(docker compose exec -T -i web /home/frappe/bench/env/bin/python3 - <<'EOF'
          import sys
          import traceback
          def _ci_excepthook(typ, value, tb):
              lineno = tb.tb_lineno if tb else -1
              traceback.print_exception(typ, value, tb)
              print("::error::rehearsal verify#2 failed at line %s: %s" % (lineno, value))
          sys.excepthook = _ci_excepthook
          # Run from bench/sites: frappe's database logger opens the
          # CWD-relative ../logs/<name>.log (see the tailnet staff-user
          # setup above); an exec inherits the container WORKDIR (bench).
          import os
          os.chdir("/home/frappe/bench/sites")
          import frappe
          frappe.init(site="toeflhouse.localhost", sites_path="/home/frappe/bench/sites")
          frappe.connect()
          assert frappe.db.exists("Student", {"first_name": "Tailnet", "last_name": "Marker"}), \
              "pre-backup marker student lost in the restore"
          assert not frappe.db.exists("Student", {"student_email_id": "upgrade-probe@example.test"}), \
              "post-backup probe record survived the restore"
          print("verify#2: data rolled back to the backup point")
          EOF
          )
          echo "$verify2" | grep -q "verify#2: data rolled back to the backup point"
          act status | grep -q ': PRODUCTION'
          echo "::notice title=Upgrade/rollback rehearsal::backup -> rebuild -> migrate -> verify -> restore -> verify"
      - name: Performance baseline (measured, not policy)
        # P1 #9: record the responsiveness of the product's primary
        # surfaces on the final deployed stack (post-rehearsal state).
        # The owner has set no performance target, so the numbers are a
        # baseline record, not a gate: the script carries no thresholds.
        working-directory: product
        run: |
          set -euo pipefail
          docker compose exec -T web \
            env PERF_DESK_USER="staff-a@example.test" PERF_DESK_PASSWORD="staff-a-ci-123" \
            python3 /product/perf_baseline.py | tee perf-baseline.json
          python3 - <<'EOF'
          import json
          data = json.load(open("perf-baseline.json"))
          for name, s in data["surfaces"].items():
              if "median_ms" in s:
                  print("::notice title=Baseline %s::min %.1f / median %.1f / max %.1f ms (%d samples)"
                        % (name, s["min_ms"], s["median_ms"], s["max_ms"], s["samples"]))
                  if not s.get("ok", True):
                      print("::warning title=Baseline %s::record not ok: %s" % (name, s.get("error", "")))
              else:
                  print("::notice title=Baseline %s::%s" % (name, s.get("skipped", s.get("error", ""))))
          print("::notice title=Performance baseline::measured, not policy (no owner capacity target exists)")
          EOF
      - name: Stack logs on failure
        if: failure()
        working-directory: product
        run: |
          # CI annotations cap the whole run at ~19 lines, and the
          # session probe already annotates from the failed tailnet step
          # itself; keep this step to the minimum context: which later
          # stage started, and the tail of the web container log.
          for f in rehearse-activate.txt perf-baseline.json; do
            if [ -f "$f" ]; then echo "::error::marker present: $f"; else echo "::error::marker absent: $f"; fi
          done
          docker compose logs --tail 3 web 2>&1 | tail -3 | sed 's/^/::error::web::/' || true
