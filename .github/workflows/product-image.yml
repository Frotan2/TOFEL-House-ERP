      - name: Multi-user tailnet contract (second client, no public exposure, restart persistence)
        # The owner deployment (D13/D15) is one central PC plus authorized
        # staff PCs over a Tailscale tailnet (runbook section 6). Tailscale
        # itself is external to the product, so this step proves the product
        # contract that makes the tailnet setup work:
        #   * a second, non-administrator client authenticates and uses the ERP
        #   * a tailnet-style proxy (foreign Host + X-Forwarded-Proto) serves
        #     the same site — the hostname the tailnet presents is arbitrary
        #   * nothing is published outside the host loopback
        #   * a full restart recovers every service and the data
        working-directory: product
        run: |
          set -euo pipefail
          # Every stage appends to tailnet-progress.txt (truncated at step
          # start); the on-failure step prints it, so the last stage
          # reached — and any failing command's output — always survives
          # the capped annotation view.
          > tailnet-progress.txt
          echo "stage: staff-user exec start" >> tailnet-progress.txt
          staff_out=$(docker compose exec -T -i web /home/frappe/bench/env/bin/python3 - <<'EOF'
          import sys
          import traceback
          def _ci_excepthook(typ, value, tb):
              lineno = tb.tb_lineno if tb else -1
              traceback.print_exception(typ, value, tb)
              print("::error::tailnet staff-user setup failed at line %s: %s" % (lineno, value))
          sys.excepthook = _ci_excepthook
          # Frappe's database logger opens the CWD-relative "../logs/<name>.log"
          # (frappe.utils.logger.create_handler). Gunicorn runs from
          # bench/sites so that resolves to bench/logs; an exec inherits the
          # container WORKDIR (bench) and would open ../logs outside the
          # mounted logs directory. Run from sites, like every bench command.
          import os
          os.chdir("/home/frappe/bench/sites")
          import frappe
          frappe.init(site="toeflhouse.localhost", sites_path="/home/frappe/bench/sites")
          frappe.connect()
          user = "staff-a@example.test"
          if not frappe.db.exists("User", user):
              doc = frappe.new_doc("User")
              doc.email = user
              doc.first_name = "Staff"
              doc.last_name = "A"
              doc.send_welcome_email = 0
              doc.new_password = "staff-a-ci-123"
              doc.add_roles("Reception")
              doc.save(ignore_permissions=True)
          frappe.db.commit()
          print("staff user ready")
          EOF
          ) && staff_rc=0 || staff_rc=$?
          if [ "$staff_rc" -ne 0 ]; then
            echo "stage: staff-user exec FAILED rc=$staff_rc" >> tailnet-progress.txt
            printf 'exec output:\n%s\n' "$staff_out" >> tailnet-progress.txt
            exit 1
          fi
          echo "stage: staff-user exec OK" >> tailnet-progress.txt
          printf 'exec output:\n%s\n' "$staff_out" >> tailnet-progress.txt
          echo "$staff_out" | grep -q "staff user ready"
          # The first-run credentials file is 0600 and owned by the
          # container's service user (bootstrap writes it for the owner),
          # so the host runner user cannot read it directly. Read it
          # in-container as root — the product's own permission model —
          # and keep the value in a shell variable that is never echoed.
          # The file is a multi-line banner; extract the Password value
          # (the whole file as a password is a wrong-password, which after
          # three attempts locks the account for 60 seconds).
          admin_cred=$(docker compose exec -T -u root web cat /home/frappe/bench/sites/toeflhouse.localhost/private/first-run-credentials.txt | awk '/^Password: /{print $2}')
          test -n "$admin_cred"
          echo "::add-mask::$admin_cred"
          echo "stage: admin credentials read (in-container root)" >> tailnet-progress.txt
          TAILNET_ADMIN_PW="$admin_cred" python3 - <<'EOF'
          import json
          import os
          import re
          import subprocess
          import urllib.error
          import urllib.parse
          import urllib.request

          # CI log lines are only reachable as run annotations; make any
          # uncaught failure carry its line number into the annotation set.
          import sys
          import traceback
          def _ci_excepthook(typ, value, tb):
              lineno = tb.tb_lineno if tb else -1
              traceback.print_exception(typ, value, tb)
              print("::error::tailnet contract failed at line %s: %s" % (lineno, value))
          sys.excepthook = _ci_excepthook
          open("tailnet-progress.txt", "a").write("stage: python contract start\n")

          BASE = "http://127.0.0.1:8000"

          # CI annotations are a capped, lossy view of the step log; every
          # stage also appends to a progress file that the on-failure step
          # prints, so the last stage reached is always recoverable.
          def progress(stage):
              print("T-SITE " + stage, flush=True)
              with open("tailnet-progress.txt", "a") as fh:
                  fh.write(stage + "\n")

          def call(path, *, data=None, headers=None, host=None, session=None):
              url = BASE + path
              body = None
              hdrs = dict(headers or {})
              if host:
                  hdrs["Host"] = host
              if session:
                  hdrs["Cookie"] = "sid=" + session
              if data is not None:
                  body = urllib.parse.urlencode(data).encode()
              request = urllib.request.Request(url, data=body, headers=hdrs)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      text = response.read().decode()
                      cookies = response.headers.get_all("Set-Cookie") or []
                      return response.status, text, cookies
              except urllib.error.HTTPError as error:
                  return error.code, error.read().decode(), []

          def desk_token(session):
              # Browser-equivalent CSRF: a real client loads the desk page
              # after login; that page carries the session's CSRF token
              # (frappe generates it there when absent). Unsafe methods
              # (POST) on a session that carries a token require the
              # X-Frappe-CSRF-Token header - send it exactly like the desk
              # does, so every authenticated POST in this contract is
              # indistinguishable from the owner's browser.
              status, text, _ = call("/desk", session=session)
              assert status == 200, ("/desk did not load", status, text[:200])
              m = re.search(r'frappe\.csrf_token = "([^"]+)"', text)
              assert m, "desk page carries no CSRF token: " + text[:200]
              return m.group(1)

          LOGIN_DIAG = []

          def login(username, password, host=None):
              status, text, cookies = call("/api/method/login",
                                           data={"usr": username, "pwd": password}, host=host)
              assert status == 200, ("login returned unexpected HTTP status", status)
              payload = json.loads(text)
              assert "exc_info" not in payload, ("login endpoint returned an exception", status)
              cookie_names = [cookie.split("=", 1)[0] for cookie in cookies]
              sids = [cookie for cookie in cookies if cookie.startswith("sid=")]
              assert sids, ("login returned no sid cookie", status, "cookie names=%r" % cookie_names)
              # Never retain cookie values or response bodies in diagnostics:
              # sid and CSRF material are live credentials, even in CI.
              LOGIN_DIAG.append({"user": username, "status": status,
                                 "has_sid": bool(sids), "cookie_names": cookie_names})
              # The Set-Cookie header is "sid=<value>; attrs..."; the cookie
              # VALUE is what a Cookie header must carry ("sid=<value>").
              return sids[0].split(";", 1)[0].split("=", 1)[1]

          def session_diag(sid):
              # Diagnose presence/cache state without emitting session IDs,
              # sessiondata, CSRF tokens, DB rows, or raw exception values.
              try:
                  probe = subprocess.check_output(
                      ["docker", "compose", "exec", "-T", "-i", "-u", "root",
                       "-e", "PROBE_SID", "web",
                       "/home/frappe/bench/env/bin/python3", "-"],
                      input="import os, json\n"
                      "os.chdir('/home/frappe/bench/sites')\n"
                      "import frappe\n"
                      "frappe.init(site='toeflhouse.localhost', sites_path='/home/frappe/bench/sites')\n"
                      "frappe.connect()\n"
                      "sid = os.environ.get('PROBE_SID', '')\n"
                      "rows = frappe.db.sql('select user,status,lastupdate,sessiondata from `tabSessions` where sid=%s', (sid,), as_dict=True)\n"
                      "row = rows[0] if rows else {}\n"
                      "data = json.loads(row.get('sessiondata') or '{}') if row else {}\n"
                      "out = {'session_present': bool(row), 'session_user': row.get('user'), 'session_status': row.get('status'), 'session_has_csrf': bool(data.get('csrf_token')), 'session_data_keys': sorted(data.keys())}\n"
                      "out['staff_session_rows'] = frappe.db.sql('select count(*) as n from `tabSessions` where user=%s', ('staff-a@example.test',))[0][0]\n"
                      "exp = frappe.get_system_settings('session_expiry') or '240:00:00'\n"
                      "parts = exp.split(':')\n"
                      "if len(parts) == 2: parts = parts + ['00']\n"
                      "secs = int(parts[0])*3600 + int(parts[1])*60 + int(parts[2])\n"
                      "thr = frappe.utils.add_to_date(frappe.utils.now(), seconds=-secs, as_string=True)\n"
                      "out['session_not_expired'] = bool(frappe.db.sql('select count(*) from `tabSessions` where sid=%s and lastupdate > %s', (sid, thr))[0][0])\n"
                      "try:\n"
                      "    cached = frappe.cache.hget('session', sid)\n"
                      "    out['cache_hit'] = bool(cached)\n"
                      "    out['cache_user'] = (cached or {}).get('data', {}).get('user')\n"
                      "except Exception as error:\n"
                      "    out['cache_hit'] = None\n"
                      "    out['cache_error_type'] = type(error).__name__\n"
                      "print('SESSIONS-DIAG ' + json.dumps(out, default=str))\n",
                      text=True, env={**os.environ, "PROBE_SID": sid}, timeout=120)
                  prefix = "SESSIONS-DIAG "
                  line = next((item for item in probe.splitlines() if item.startswith(prefix)), None)
                  if line is None:
                      raise ValueError("safe session summary missing")
                  data = json.loads(line[len(prefix):])
                  fields = ("session_present", "session_user", "session_status",
                            "session_has_csrf", "session_data_keys", "staff_session_rows",
                            "session_not_expired", "cache_hit", "cache_user", "cache_error_type")
                  summary = json.dumps({key: data.get(key) for key in fields}, sort_keys=True)
                  print("::notice title=Tailnet session diagnostics::" + summary, flush=True)
                  with open("tailnet-progress.txt", "a", encoding="utf-8") as fh:
                      fh.write("session diagnostics " + summary + "\n")
              except Exception as error:
                  message = "safe session diagnostics unavailable (%s)" % type(error).__name__
                  print("::warning title=Tailnet session diagnostics::" + message, flush=True)
                  with open("tailnet-progress.txt", "a", encoding="utf-8") as fh:
                      fh.write(message + "\n")

          progress("admin password present: %s" % ("yes" if os.environ.get("TAILNET_ADMIN_PW") else "no"))
          admin_pw = os.environ["TAILNET_ADMIN_PW"]
          staff_pw = "staff-a-ci-123"
          progress("staff login start")
          staff = login("staff-a@example.test", staff_pw)
          progress("staff login OK: " + repr(LOGIN_DIAG[-1])[:220])
          session_diag(staff)

          # (1) The second client authenticates and uses the ERP.
          status, text, _ = call("/api/method/toefl_house.desk.reception.work", session=staff)
          assert status == 200 and "exc_info" not in json.loads(text), (
              "staff desk call refused", status, text[:400],
              "logins=%r" % LOGIN_DIAG)
          # Session isolation: the staff session cannot reach an admin-only
          # surface. The POST carries the staff session's CSRF token (like a
          # browser), so a denial here is a permission decision - assert it
          # is one.
          status, text, _ = call("/api/method/toefl_house.administration.get_control_center_snapshot",
                                 data={}, session=staff,
                                 headers={"X-Frappe-CSRF-Token": desk_token(staff)})
          payload = json.loads(text)
          assert "CSRFTokenError" not in text, "admin-surface denial masked by the CSRF wall: " + text[:200]
          assert "PermissionError" in text or status != 200, "staff session reached an admin-only endpoint"
          progress("second client: desk OK, admin surface denied")
          print("second client: authenticated desk access OK; admin surface denied OK")

          # (2) Tailnet proxy contract: a foreign Host with forwarded-https
          # must serve the same site (wsgi.py pins the site, so the hostname
          # the tailnet presents is irrelevant to the product).
          tailnet = "erp.toeflhouse.example"
          status, text, _ = call("/login", host=tailnet,
                                 headers={"X-Forwarded-Proto": "https"})
          assert status == 200 and "Password" in text, (status, text[:200])
          tailnet_sid = login("staff-a@example.test", staff_pw, host=tailnet)
          status, text, _ = call("/api/method/toefl_house.desk.reception.work",
                                 session=tailnet_sid, host=tailnet,
                                 headers={"X-Forwarded-Proto": "https"})
          assert status == 200 and "exc_info" not in json.loads(text), text[:300]
          progress("tailnet proxy: foreign-host login and desk OK")
          print("tailnet proxy: foreign-host login and desk OK")

          # (3) No public exposure: compose publishes loopback only and the
          # host listens on loopback only.
          compose = json.loads(subprocess.check_output(
              ["docker", "compose", "config", "--format", "json"], text=True))
          published = [p for service in compose["services"].values()
                       for p in (service.get("ports") or [])]
          assert published, "compose declares no published ports"
          for entry in published:
              # compose v2 "config --format json" emits the compose-spec long
              # form ({"host_ip": ..., "published": ...}); older docker
              # compose emits {"hostIP": ..., "publishedPort": ...}; a
              # shorthand string is "host:host:container". An absent bind
              # address means 0.0.0.0 (every interface) - never allowed.
              if isinstance(entry, str):
                  host = entry.split(":", 1)[0] if ":" in entry else "0.0.0.0"
              elif "hostIP" in entry:
                  host = entry["hostIP"]
              else:
                  host = entry.get("host_ip") or "0.0.0.0"
              assert host in ("127.0.0.1", "localhost"), entry
          # ss -ltn columns: State Recv-Q Send-Q Local Address:Port Peer
          # (the local address is the fourth field, index 3).
          listeners = subprocess.check_output(
              ["ss", "-ltn"], text=True).splitlines()
          for line in listeners:
              if any((":" + port) in line for port in ("8000", "9000")):
                  assert line.split()[3].startswith("127.0.0.1"), line
          external = subprocess.check_output(["hostname", "-i"], text=True).split()[0]
          try:
              urllib.request.urlopen("http://%s:8000/" % external, timeout=5)
              raise AssertionError("port 8000 answers on the non-loopback interface")
          except urllib.error.HTTPError:
              raise AssertionError("port 8000 answers on the non-loopback interface")
          except (urllib.error.URLError, ConnectionRefusedError, OSError):
              pass  # connection refused: exactly what loopback-only means
          progress("no public exposure: loopback-only publish and listen OK")
          print("no public exposure: loopback-only publish and listen OK")

          # (4) Restart persistence: a marker record, a full restart, every
          # service back (worker/scheduler/socketio included), data intact.
          progress("marker record insert start")
          # A stdin script, not "python -c": the insert is an if-statement,
          # and a compound statement cannot follow a semicolon on one
          # logical line (-c would die with SyntaxError before the DB).
          marker_out = subprocess.run(["docker", "compose", "exec", "-T", "-i", "web",
                                       "/home/frappe/bench/env/bin/python3", "-"],
                                      input="import sys, traceback\n"
                                            "def _ci_excepthook(typ, value, tb):\n"
                                            "    traceback.print_exception(typ, value, tb)\n"
                                            "    print('::error::marker insert failed: %s' % value)\n"
                                            "sys.excepthook = _ci_excepthook\n"
                                            "import os\n"
                                            "os.chdir('/home/frappe/bench/sites')\n"
                                            "import frappe\n"
                                            "frappe.init(site='toeflhouse.localhost', sites_path='/home/frappe/bench/sites')\n"
                                            "frappe.connect()\n"
                                            "if not frappe.db.exists('Student', {'first_name': 'Tailnet', 'last_name': 'Marker'}):\n"
                                            "    frappe.get_doc({'doctype': 'Student', 'first_name': 'Tailnet', 'last_name': 'Marker', 'student_email_id': 'tailnet-marker@example.test'}).insert(ignore_permissions=True)\n"
                                            "    frappe.db.commit()\n"
                                            "print('marker record ready')\n",
                                      capture_output=True, text=True)
          if marker_out.returncode != 0:
              open("tailnet-progress.txt", "a").write(
                  "stage: marker insert FAILED rc=%s\n%s\n%s\n"
                  % (marker_out.returncode, marker_out.stdout, marker_out.stderr))
              print("::error::marker insert failed rc=%s: %s"
                    % (marker_out.returncode, (marker_out.stderr or marker_out.stdout)[-800:]), flush=True)
              sys.exit(1)
          print(marker_out.stdout.strip(), flush=True)
          progress("marker record inserted")
          progress("full restart start")
          subprocess.run(["docker", "compose", "restart"], check=True)
          progress("full restart issued")
          import time
          for _ in range(120):
              try:
                  urllib.request.urlopen(BASE + "/", timeout=5)
                  break
              except Exception:
                  time.sleep(5)
          else:
              raise AssertionError("site did not answer after restart")
          progress("site answered after restart")
          # compose v2 emits either a JSON array or one object per line
          # (NDJSON) depending on the version; accept both.
          def stack_states():
              raw = subprocess.check_output(
                  ["docker", "compose", "ps", "--format", "json"], text=True).strip()
              return json.loads(raw) if raw.startswith("[") else [
                  json.loads(line) for line in raw.splitlines() if line.strip()]
          # The web can answer before the slower services (socketio's node
          # process, worker) have settled - poll for the full stack instead
          # of asserting on the first sample.
          states = missing = None
          # CI runners are shared and loaded; give the full stack (socketio's
          # node process and the bench worker settle slowest) up to ~10
          # minutes. The bound is kept so a genuinely broken service still
          # fails the contract plainly instead of waiting forever.
          for attempt in range(60):  # up to ~10 minutes
              states = stack_states()
              names = sorted(item["Name"] for item in states)
              running = {item["Name"] for item in states if item.get("State") == "running"}
              missing = set(names) - running
              if not missing:
                  break
              progress("ps retry %d: waiting for %s" % (attempt + 1, sorted(missing)))
              time.sleep(10)
          progress("ps settled: %d services, missing=%s" % (len(states), sorted(missing or set())))
          print("T-SITE compose ps raw: " + repr(states)[:400], flush=True)
          if missing:
              # Self-diagnose: name the actual cause (crash-loop exit code,
              # OOMKilled, or a slow dependency) via annotations, since the
              # job log is not reachable after the step ends.
              import subprocess as _sp
              def _diag(out, head, tail=1400):
                  text = (out or "").strip()
                  return ("::error::restart-diag %s::%s" % (head, text)).strip()[:tail]
              try:
                  states_a = _sp.check_output(
                      ["docker", "compose", "ps", "-a", "--format", "json"],
                      text=True)
              except Exception as exc:
                  states_a = "ps -a failed: %s" % exc
              print(_diag(states_a, "ps"), flush=True)
              for svc in sorted(missing):
                  try:
                      info = _sp.check_output(
                          ["docker", "inspect", svc, "--format",
                           "RestartCount={{.RestartCount}} State={{.State.Status}} Exit={{.State.ExitCode}} OOM={{.State.OOMKilled}}"],
                          text=True)
                  except Exception as exc:
                      info = "inspect failed: %s" % exc
                  try:
                      logs = _sp.run(["docker", "logs", "--tail", "40", svc],
                                     capture_output=True, text=True)
                      log_text = (logs.stdout + "\n" + logs.stderr)[-1100:]
                  except Exception as exc:
                      log_text = "logs failed: %s" % exc
                  print("::error::restart-diag %s::%s\n%s" % (
                      svc, (info or "").strip(), log_text.replace("\n", " | ")), flush=True)
              try:
                  free = _sp.check_output(["free", "-m"], text=True)
              except Exception:
                  free = "free failed"
              print(_diag(free, "mem"), flush=True)
          assert not missing, "services not running after restart: %s" % sorted(missing)
          # After a full restart the web can answer before the database is
          # back; the logins (which query the DB) therefore retry briefly.
          def login_retry(username, password, tries=12):
              last = None
              for _ in range(tries):
                  try:
                      return login(username, password)
                  except AssertionError as exc:
                      last = exc
                      print("T-SITE login retry %s: %s" % (username, exc), flush=True)
                      time.sleep(5)
              raise last
          progress("admin login start")
          admin2 = login_retry("Administrator", admin_pw)
          progress("admin login OK")
          # Browser-equivalent: the desk page carries the session CSRF
          # token; the POST must send it (see desk_token).
          status, text, _ = call("/api/method/frappe.client.get_count",
                                 data={"doctype": "Student"}, session=admin2,
                                 headers={"X-Frappe-CSRF-Token": desk_token(admin2)})
          payload = json.loads(text)
          assert "CSRFTokenError" not in text, "authenticated read masked by the CSRF wall: " + text[:200]
          # frappe's whitelist envelope carries the return value in "message".
          count = payload.get("count", payload.get("message", 0))
          assert int(count) >= 1, payload
          progress("student count OK: %s" % count)
          staff2 = login_retry("staff-a@example.test", staff_pw)
          status, text, _ = call("/api/method/toefl_house.desk.reception.work", session=staff2)
          assert status == 200 and "exc_info" not in json.loads(text), text[:300]
          progress("restart persistence verified")
          print("restart persistence: %d services running, data and access intact" % len(names))
          EOF
          echo "::notice title=Multi-user tailnet contract::second client + tailnet proxy + loopback-only exposure + restart persistence"
      - name: Upgrade/rollback rehearsal (encrypted backup -> rebuild -> migrate -> verify -> restore -> verify)
        # P1 #8: the upgrade/rollback path is exercised on the real product
        # stack with native encrypted Frappe database/files artifacts. The
        # preceding step qualifies the four-artifact Owner recovery set and
        # separate-volume restore; this CI stage does not emulate Windows.
        #   backup   a fresh native encrypted database/files set
        #   rebuild  image rebuild + full container redeploy (volumes intact)
        #   migrate  bench migrate, the migration phase of every ERP upgrade
        #   verify   data and the production activation survive the redeploy
        #   restore  the native encrypted files using the recovered site key
        #   verify   data is exactly at the backup point (the record written
        #            after the backup is rolled back; the pre-backup record
        #            is intact) and the site is healthy again
        working-directory: product
        run: |
          python3 ../tools/foundation/annotated_step.py "Upgrade/rollback rehearsal" -- bash -euo pipefail <<'TOEFL_UPGRADE_REHEARSAL'
          checkpoint="upgrade setup"
          trap 'rc=$?; echo "::error title=Product upgrade/rollback failure::checkpoint=$checkpoint exit=$rc"; exit "$rc"' ERR
          act() { docker compose exec -T web /product/activate.py "$@"; }
          site=data/sites/toeflhouse.localhost
          backup_dir=$site/private/backups
          cleanup_upgrade_sidecars() {
            find "$backup_dir" -maxdepth 1 -type f -name '*-site_config_backup*.json' -delete 2>/dev/null || true
          }
          trap cleanup_upgrade_sidecars EXIT

          # (0) The rehearsal targets the site the owner would upgrade: an
          # activated production site (the first-boot step ended in REFUSED
          # after proving deactivation; activation is a reversible site
          # config, and the rehearsal re-proves the gate end to end).
          checkpoint="re-activate the verified backup site before upgrade"
          act status | grep -q 'Site operational mode: REFUSED'
          set +e
          act activate --confirm toeflhouse.localhost > rehearse-activate.txt 2>&1
          activation_rc=$?
          set -e
          if [ "$activation_rc" -ne 0 ]; then
            activation_detail="$(tail -n 1 rehearse-activate.txt | tr '\r\n' ' ')"
            echo "::error title=Upgrade precondition::site re-activation failed with exit $activation_rc: ${activation_detail:0:400}"
            exit "$activation_rc"
          fi
          cat rehearse-activate.txt
          grep -q 'All gates passed' rehearse-activate.txt
          act status | grep -q 'Site operational mode: PRODUCTION'
          echo "::notice title=Rehearsal start::site re-activated to PRODUCTION"
          upgrade_file_marker="ERP-UPGRADE-FILE-${GITHUB_RUN_ID}"
          docker compose exec -T -e CI_UPGRADE_FILE_MARKER="$upgrade_file_marker" web sh -eu -c '
            mkdir -p sites/toeflhouse.localhost/public/files sites/toeflhouse.localhost/private/files
            printf "%s" "$CI_UPGRADE_FILE_MARKER" > sites/toeflhouse.localhost/public/files/upgrade-restore-marker.txt
            printf "%s" "$CI_UPGRADE_FILE_MARKER" > sites/toeflhouse.localhost/private/files/upgrade-restore-marker.txt
          '

          checkpoint="fresh encrypted native database/public/private file backup"
          # (1) BACKUP: fresh native encrypted database/files payloads.
          # The Frappe site-config sidecar has a misleading -enc name but is
          # plaintext; this rollback test does not export it and always removes
          # it through the EXIT trap. The prior step separately tests its GPG
          # recovery artifact on the loop-backed secondary volume.
          before=$(find "$backup_dir" -maxdepth 1 -type f -name '*-database-enc.sql.gz' | wc -l)
          docker compose run --rm --no-deps --entrypoint /home/frappe/bench/env/bin/python web /product/backup.py
          after=$(find "$backup_dir" -maxdepth 1 -type f -name '*-database-enc.sql.gz' | wc -l)
          test $((after - before)) = 1
          encrypted_db=$(find "$backup_dir" -maxdepth 1 -type f -name '*-database-enc.sql.gz' -printf '%T@ %f\n' | sort -nr | head -1 | cut -d' ' -f2-)
          test -n "$encrypted_db"
          triple_base=${encrypted_db%-database-enc.sql.gz}
          test -s "$backup_dir/${triple_base}-files-enc.tar"
          test -s "$backup_dir/${triple_base}-private-files-enc.tar"
          for name in "$encrypted_db" "${triple_base}-files-enc.tar" "${triple_base}-private-files-enc.tar"; do
            packet_output="$(docker compose exec -T web gpg --batch --list-packets "sites/toeflhouse.localhost/private/backups/$name" 2>&1)" || {
              echo "::error::GPG could not inspect native backup artifact $name"; exit 1;
            }
            if [[ "$packet_output" != *":symkey enc packet:"* ]]; then
              echo "::error::native backup artifact is not symmetrically encrypted: $name"; exit 1;
            fi
          done
          test "$(find "$backup_dir" -maxdepth 1 -type f -name '*-site_config_backup*.json' | wc -l)" -eq 1
          find "$backup_dir" -maxdepth 1 -type f -name '*-site_config_backup*.json' -delete
          test -z "$(find "$backup_dir" -maxdepth 1 -type f -name '*-site_config_backup*.json' -print -quit)"
          echo "::notice title=Encrypted rollback backup::native encrypted database/files set ${triple_base}; plaintext site-config sidecar deleted immediately"
          post_backup_file_marker="ERP-POST-UPGRADE-FILE-${GITHUB_RUN_ID}"
          docker compose exec -T -e CI_POST_BACKUP_FILE_MARKER="$post_backup_file_marker" web sh -eu -c '
            printf "%s" "$CI_POST_BACKUP_FILE_MARKER" > sites/toeflhouse.localhost/public/files/post-backup-upgrade-marker.txt
            printf "%s" "$CI_POST_BACKUP_FILE_MARKER" > sites/toeflhouse.localhost/private/files/post-backup-upgrade-marker.txt
          '

          checkpoint="image rebuild and full container redeploy"
          # (2) REBUILD: rebuild the application image (cached: same source)
          # and redeploy every container; the data volumes are untouched -
          # exactly what a software update does on the owner's machine. The
          # db-data volume identity is asserted explicitly across the
          # rebuild (content survival is proven by the marker data below).
          vol_before=$(docker volume inspect toefl-house-erp_db-data --format '{{.Name}}|{{.Driver}}')
          docker compose build
          docker compose up -d --force-recreate
          for i in $(seq 1 180); do curl --fail --silent http://127.0.0.1:8000/ >/dev/null && break; sleep 5; done
          curl --fail --silent http://127.0.0.1:8000/ >/dev/null
          vol_after=$(docker volume inspect toefl-house-erp_db-data --format '{{.Name}}|{{.Driver}}')
          test "$vol_before" = "$vol_after"
          echo "::notice title=Rehearsal rebuild::stack redeployed after ~$((i*5))s; db-data volume identity unchanged"

          checkpoint="bench migrate"
          # (3) MIGRATE: the upgrade's migration phase (the boot entrypoint
          # already ran one; the explicit run is the command the owner's
          # upgrade performs).
          docker compose exec -T web /build/tools/bin/bench --site toeflhouse.localhost migrate
          echo "::notice title=Rehearsal migrate::bench migrate OK"

          checkpoint="pre/post-backup database verification"
          # (4) VERIFY: pre-backup data and the production activation
          # survived the redeploy; then a post-backup record that the
          # restore must roll back. (exec -i + marker assertion: a
          # script that never ran must never count as verified.)
          verify1=$(docker compose exec -T -i web /home/frappe/bench/env/bin/python3 - <<'EOF'
          import sys
          import traceback
          def _ci_excepthook(typ, value, tb):
              lineno = tb.tb_lineno if tb else -1
              traceback.print_exception(typ, value, tb)
              print("::error::rehearsal verify#1 failed at line %s: %s" % (lineno, value))
          sys.excepthook = _ci_excepthook
          # Run from bench/sites: frappe's database logger opens the
          # CWD-relative ../logs/<name>.log (see the tailnet staff-user
          # setup above); an exec inherits the container WORKDIR (bench).
          import os
          os.chdir("/home/frappe/bench/sites")
          import frappe
          frappe.init(site="toeflhouse.localhost", sites_path="/home/frappe/bench/sites")
          frappe.connect()
          assert frappe.db.exists("Student", {"first_name": "Tailnet", "last_name": "Marker"}), \
              "pre-backup marker student lost in the redeploy"
          email = "upgrade-probe@example.test"
          if not frappe.db.exists("Student", {"student_email_id": email}):
              frappe.get_doc({"doctype": "Student", "first_name": "Upgrade", "last_name": "Probe",
                              "student_email_id": email}).insert(ignore_permissions=True)
              frappe.db.commit()
          assert frappe.db.exists("Student", {"student_email_id": email})
          print("verify#1: pre-backup data intact; post-backup probe record created")
          EOF
          )
          echo "$verify1" | grep -q "verify#1: pre-backup data intact"
          act status | tee rehearsal-verify1-status.txt
          grep -q 'Site operational mode: PRODUCTION' rehearsal-verify1-status.txt
          grep -q 'Production authorization: REJECT' rehearsal-verify1-status.txt
          echo "::notice title=Rehearsal verify 1::data and PRODUCTION site mode intact after redeploy + migrate; authorization remains REJECT"

          checkpoint="native encrypted database and files restore"
          # (5) RESTORE the encrypted database/files set with the native
          # Frappe key. Read sensitive values into shell variables without
          # echoing them. Stop web and background writers; use a one-off web
          # container so no application request can race the restore.
          admin_pw=$(docker compose exec -T -u root web cat /home/frappe/bench/sites/toeflhouse.localhost/private/first-run-credentials.txt | awk '/^Password: /{print $2}')
          db_root_pw=$(awk -F= '/^MARIADB_ROOT_PASSWORD=/{print $2}' data/secrets/db.env)
          backup_encryption_key=$(docker compose exec -T web /home/frappe/bench/env/bin/python -c 'import json; print(json.load(open("/home/frappe/bench/sites/toeflhouse.localhost/site_config.json"))["backup_encryption_key"])')
          test -n "$admin_pw" && test -n "$db_root_pw" && test -n "$backup_encryption_key"
          echo "::add-mask::$admin_pw"
          echo "::add-mask::$db_root_pw"
          echo "::add-mask::$backup_encryption_key"
          docker compose stop web worker scheduler socketio
          # Native Frappe restore overlays archive members and leaves files
          # absent from the backup untouched. Preserve the old trees beside
          # the site, then extract into empty public/private destinations.
          restore_stage="$site/private/.ci-restore-files-upgrade-$GITHUB_RUN_ID"
          mkdir -m 700 -p "$restore_stage"
          for scope in public private; do
            mkdir -p "$site/$scope"
            files_dir="$site/$scope/files"
            if [ -d "$files_dir" ]; then mv "$files_dir" "$restore_stage/$scope-files"; fi
            mkdir -p "$files_dir"
          done
          # Credentials and the native key travel to the restore adapter only
          # over stdin; they are never Docker/Bench process arguments.
          RESTORE_SITE=toeflhouse.localhost \
          RESTORE_BACKUP_SET="$triple_base" \
          RESTORE_DB_ROOT_PASSWORD="$db_root_pw" \
          RESTORE_ADMIN_PASSWORD="$admin_pw" \
          RESTORE_ENCRYPTION_KEY="$backup_encryption_key" \
          python3 - <<'PY' | docker compose run --rm --no-deps -i -T \
            --entrypoint /home/frappe/bench/env/bin/python web /product/restore.py
          import json, os, sys
          json.dump({
              "site": os.environ["RESTORE_SITE"],
              "backup_set": os.environ["RESTORE_BACKUP_SET"],
              "db_root_password": os.environ["RESTORE_DB_ROOT_PASSWORD"],
              "admin_password": os.environ["RESTORE_ADMIN_PASSWORD"],
              "encryption_key": os.environ["RESTORE_ENCRYPTION_KEY"],
          }, sys.stdout)
          sys.stdout.write("\n")
          PY
          docker compose up -d --no-build
          for i in $(seq 1 180); do curl --fail --silent http://127.0.0.1:8000/ >/dev/null && break; sleep 5; done
          curl --fail --silent http://127.0.0.1:8000/ >/dev/null
          echo "::notice title=Encrypted rollback restore::native encrypted set ${triple_base} restored; full application stack is back online"

          checkpoint="database and public/private file snapshot verification"
          # (6) VERIFY: the data is exactly at the backup point - the
          # pre-backup record is present, the post-backup record is gone -
          # and the site is healthy in production mode. (exec -i + marker
          # assertion, as in verify#1.)
          verify2=$(docker compose exec -T -i web /home/frappe/bench/env/bin/python3 - <<'EOF'
          import sys
          import traceback
          def _ci_excepthook(typ, value, tb):
              lineno = tb.tb_lineno if tb else -1
              traceback.print_exception(typ, value, tb)
              print("::error::rehearsal verify#2 failed at line %s: %s" % (lineno, value))
          sys.excepthook = _ci_excepthook
          # Run from bench/sites: frappe's database logger opens the
          # CWD-relative ../logs/<name>.log (see the tailnet staff-user
          # setup above); an exec inherits the container WORKDIR (bench).
          import os
          os.chdir("/home/frappe/bench/sites")
          import frappe
          frappe.init(site="toeflhouse.localhost", sites_path="/home/frappe/bench/sites")
          frappe.connect()
          assert frappe.db.exists("Student", {"first_name": "Tailnet", "last_name": "Marker"}), \
              "pre-backup marker student lost in the restore"
          assert not frappe.db.exists("Student", {"student_email_id": "upgrade-probe@example.test"}), \
              "post-backup probe record survived the restore"
          print("verify#2: data rolled back to the backup point")
          EOF
          )
          echo "$verify2" | grep -q "verify#2: data rolled back to the backup point"
          for scope in public private; do
            restored_file="$(docker compose exec -T web cat "sites/toeflhouse.localhost/$scope/files/upgrade-restore-marker.txt")"
            test "$restored_file" = "$upgrade_file_marker" || { echo "::error::${scope} upgrade file marker was not restored"; exit 1; }
            docker compose exec -T web sh -eu -c 'test ! -e "$1"' sh \
              "sites/toeflhouse.localhost/$scope/files/post-backup-upgrade-marker.txt"
          done
          rm -rf -- "$restore_stage"
          act status | tee rehearsal-verify2-status.txt
          grep -q 'Site operational mode: PRODUCTION' rehearsal-verify2-status.txt
          grep -q 'Production authorization: REJECT' rehearsal-verify2-status.txt
          echo "::notice title=Upgrade/rollback rehearsal::encrypted native backup -> rebuild -> migrate -> restore -> verify; site mode PRODUCTION, authorization REJECT"
          TOEFL_UPGRADE_REHEARSAL
      - name: Performance baseline (measured, not policy)
        # P1 #9: record the responsiveness of the product's primary
        # surfaces on the final deployed stack (post-rehearsal state).
        # The owner has set no performance target, so the numbers are a
        # baseline record, not a gate: the script carries no thresholds.
        working-directory: product
        run: |
          set -euo pipefail
          docker compose exec -T web \
            env PERF_DESK_USER="staff-a@example.test" PERF_DESK_PASSWORD="staff-a-ci-123" \
            python3 /product/perf_baseline.py | tee perf-baseline.json
          python3 - <<'EOF'
          import json
          data = json.load(open("perf-baseline.json"))
          for name, s in data["surfaces"].items():
              if "median_ms" in s:
                  print("::notice title=Baseline %s::min %.1f / median %.1f / max %.1f ms (%d samples)"
                        % (name, s["min_ms"], s["median_ms"], s["max_ms"], s["samples"]))
                  if not s.get("ok", True):
                      print("::warning title=Baseline %s::record not ok: %s" % (name, s.get("error", "")))
              else:
                  print("::notice title=Baseline %s::%s" % (name, s.get("skipped", s.get("error", ""))))
          print("::notice title=Performance baseline::measured, not policy (no owner capacity target exists)")
          EOF
      - name: Stack logs on failure
        if: failure()
        working-directory: product
        run: |
          # CI annotations cap the whole run at ~19 lines, and the
          # session probe already annotates from the failed tailnet step
          # itself; keep this step to the minimum context: which later
          # stage started, and the tail of the web container log.
          for f in rehearse-activate.txt perf-baseline.json; do
            if [ -f "$f" ]; then echo "::error::marker present: $f"; else echo "::error::marker absent: $f"; fi
          done
          # bootstrap prints only a safe exception class, exit status, numeric
          # OS error code, and compact frame names/line numbers; it never forwards
          # Frappe messages, paths, source text, or stdin secrets. This short
          # tail gives startup failures an actionable, secret-free annotation.
          docker compose logs --tail 3 bootstrap 2>&1 | tail -3 | sed 's/^/::error::bootstrap::/' || true
          docker compose logs --tail 3 web 2>&1 | tail -3 | sed 's/^/::error::web::/' || true

  windows-worktree-eol:
    name: Windows stale-worktree EOL normalization
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Verify fresh checkout and normalize a stale CRLF worktree
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config core.autocrlf true
          git checkout --force $env:GITHUB_SHA
          python tools/foundation/annotated_step.py "Windows fresh checkout EOL contract" -- python -m unittest `
            tests.foundation.test_product_packaging.LineEndingContract `
            tests.foundation.test_product_packaging.CmdParserSafetyContract `
            tests.foundation.test_product_packaging.CmdSyntaxContract
          if ($LASTEXITCODE -ne 0) { throw "fresh-checkout EOL tests failed with exit $LASTEXITCODE" }

          # Recreate the reported failure after .gitattributes is already
          # present: an existing checkout can retain CRLF until explicitly
          # rewritten. Include BOM + CRLF on the exact failing baseline file.
          $strict = [System.Text.UTF8Encoding]::new($false, $true)
          $noBom = [System.Text.UTF8Encoding]::new($false)
          $dockerfilePath = Join-Path $PWD "product/app.Dockerfile"
          $dockerfileLines = [System.IO.File]::ReadAllLines($dockerfilePath, $strict)
          $copyLines = @($dockerfileLines | Where-Object { $_.TrimStart() -match '^COPY\s+' })
          $copyMatches = [System.Text.RegularExpressions.Regex]::Matches(
            [System.IO.File]::ReadAllText($dockerfilePath), '(?m)^[ \t]*COPY[ \t]+(\S+)[ \t]+\S+[ \t]*$')
          if ($copyLines.Count -eq 0 -or $copyMatches.Count -ne $copyLines.Count) {
            throw "Dockerfile contains empty or unsupported COPY syntax; update the stale-worktree parser first"
          }
          $textExtensions = @(".py", ".sh", ".js", ".json", ".css", ".md", ".txt", ".toml",
            ".yaml", ".yml", ".html", ".xml", ".csv", ".svg", ".jinja", ".jinja2")
          $staleTargetList = New-Object System.Collections.ArrayList
          foreach ($match in $copyMatches) {
            $sourcePath = Join-Path $PWD $match.Groups[1].Value
            if (-not (Test-Path -LiteralPath $sourcePath)) { throw "Missing Dockerfile COPY source: $sourcePath" }
            if (Test-Path -LiteralPath $sourcePath -PathType Container) {
              Get-ChildItem -LiteralPath $sourcePath -File -Recurse -Force |
                Where-Object { $textExtensions -contains $_.Extension.ToLowerInvariant() } |
                ForEach-Object {
                  $rootPath = $PWD.Path.TrimEnd([char[]]@('\', '/'))
                  $relative = $_.FullName.Substring($rootPath.Length + 1).Replace('\', '/')
                  [void]$staleTargetList.Add($relative)
                }
            } elseif ($textExtensions -contains ([System.IO.Path]::GetExtension($sourcePath).ToLowerInvariant())) {
              [void]$staleTargetList.Add($match.Groups[1].Value)
            }
          }
          foreach ($controlFile in @(".gitattributes", ".dockerignore", "product/app.Dockerfile",
                                     "product/docker-compose.yml")) {
            if (-not (Test-Path -LiteralPath (Join-Path $PWD $controlFile) -PathType Leaf)) {
              throw "Missing product build-control file: $controlFile"
            }
            [void]$staleTargetList.Add($controlFile)
          }
          $staleTargets = @($staleTargetList | Select-Object -Unique)
          if ($staleTargets.Count -lt $copyMatches.Count) {
            throw "stale checkout simulation did not cover the complete Docker COPY allowlist"
          }
          foreach ($relative in $staleTargets) {
            $path = Join-Path $PWD $relative
            $text = $strict.GetString([System.IO.File]::ReadAllBytes($path))
            $lf = [System.Text.RegularExpressions.Regex]::Replace($text, '\r\n?', "`n")
            $crlf = $lf.Replace("`n", "`r`n")
            [System.IO.File]::WriteAllBytes($path, $noBom.GetBytes($crlf))
          }
          $perfPath = Join-Path $PWD "product/perf_baseline.py"
          $body = [System.IO.File]::ReadAllBytes($perfPath)
          [byte[]]$withBom = ([byte[]](0xEF, 0xBB, 0xBF)) + $body
          [System.IO.File]::WriteAllBytes($perfPath, $withBom)
          # Prove the fixture is physical bytes, not an attribute-only
          # simulation: this exact Docker COPY input begins UTF-8 BOM + CRLF.
          $staleBytes = [System.IO.File]::ReadAllBytes($perfPath)
          if ($staleBytes.Length -lt 5 -or $staleBytes[0] -ne 0xEF -or
              $staleBytes[1] -ne 0xBB -or $staleBytes[2] -ne 0xBF) {
            throw "stale worktree simulation failed: UTF-8 BOM bytes are absent"
          }
          $staleText = $strict.GetString($staleBytes, 3, $staleBytes.Length - 3)
          if (-not $staleText.Contains("`r`n")) {
            throw "stale worktree simulation failed: physical CRLF bytes are absent"
          }
          $before = git ls-files --eol -- product/perf_baseline.py
          if ($before -notmatch "w/crlf") { throw "stale worktree simulation failed: $before" }

          $normalizer = Join-Path $PWD "product/windows/Normalize Product Sources.ps1"
          $windowsPowerShell = Join-Path $env:WINDIR "System32/WindowsPowerShell/v1.0/powershell.exe"
          & $windowsPowerShell -NoProfile -ExecutionPolicy Bypass -File $normalizer
          $normalizerExit = $LASTEXITCODE
          if ($normalizerExit -ne 10) {
            throw "expected normalizer exit 10 for repaired CRLF/BOM files, got $normalizerExit"
          }
          python tools/foundation/annotated_step.py "Windows normalized physical-byte EOL contract" -- python -m unittest tests.foundation.test_product_packaging.LineEndingContract
          if ($LASTEXITCODE -ne 0) { throw "normalized physical-byte EOL tests failed with exit $LASTEXITCODE" }
          python tools/foundation/annotated_step.py "Windows normalized stale-worktree packaging suite" -- python -m unittest tests.foundation.test_product_packaging
          if ($LASTEXITCODE -ne 0) { throw "normalized packaging tests failed with exit $LASTEXITCODE" }

          & $windowsPowerShell -NoProfile -ExecutionPolicy Bypass -File $normalizer
          $idempotentExit = $LASTEXITCODE
          if ($idempotentExit -ne 0) {
            throw "normalizer was not idempotent: expected exit 0 on an already-clean tree, got $idempotentExit"
          }
