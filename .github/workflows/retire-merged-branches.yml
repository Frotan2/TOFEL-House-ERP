name: One-time verified final branch retirement
# Only after independently qualified PRs #77, #80 and #81 merge, retire
# their exact verified heads and this cleanup PR head; preserve main and history.
# Runs only after this workflow is changed on main. Deletion is guarded
# by exact branch SHAs, replacement PRs and merged PR #69.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/retire-merged-branches.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: retire-final-branches-main
  cancel-in-progress: false

jobs:
  retire-exact-reviewed-heads:
    if: github.repository == 'Frotan2/TOFEL-House-ERP'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Retire only exact reviewed, already integrated agent heads
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CONFIRM_FINAL_BRANCH_RETIREMENT: exact-24-heads-after-pr81
        run: python3 tools/foundation/annotated_step.py "Retire final verified branches" -- python3 tools/maintenance/retire_final_branches.py --apply
