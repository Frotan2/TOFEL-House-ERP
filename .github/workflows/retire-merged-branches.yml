name: Archive and retire exact merged release branches

# A one-time, SHA-pinned cleanup. Only a workflow-file merge to main or an
# explicitly confirmed manual dispatch can trigger changes. Never change main,
# never delete any open/unmerged/moved branch, never weaken policy gates.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/retire-merged-branches.yml
      - tools/maintenance/retire_release_branches_20261111.py
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type archive-and-retire-merged-branches to authorize cleanup'
        type: string
        required: true

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: toefl-house-release-branch-retirement
  cancel-in-progress: false

jobs:
  archive-and-retire:
    if: >-
      github.repository == 'Frotan2/TOFEL-House-ERP' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       inputs.confirmation == 'archive-and-retire-merged-branches')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Verify exact-SHA retirement contracts
        run: python3 -m unittest -v tests.foundation.test_release_branch_cleanup_20261111
      - name: Archive and retire only audited merged branches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/maintenance/retire_release_branches_20261111.py --apply
