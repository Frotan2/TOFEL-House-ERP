name: Foundation runner qualification

on:
  push:
    branches: [arena/01a0b5c4-tofel-house-erp]
    paths:
      - .github/workflows/foundation-runner.yml
      - tools/session_branch.py
      - tools/foundation/runner_probe.py
      - docs/engineering/foundation-version-matrix.json
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: foundation-runner-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runner:
    if: github.ref == 'refs/heads/arena/01a0b5c4-tofel-house-erp'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Verify controlled runner downloads and services
        run: python3 tools/foundation/runner_probe.py
      - name: Publish sanitized machine-readable evidence
        if: always() && hashFiles('.foundation/runner-evidence/runner-result.json') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/foundation/publish_evidence.py .foundation/runner-evidence/runner-result.json
      - name: Retain explicit probe evidence, including failures
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: foundation-runner-${{ github.run_id }}-${{ github.run_attempt }}
          path: .foundation/runner-evidence/
          if-no-files-found: error
          retention-days: 14
