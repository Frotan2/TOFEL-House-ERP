name: Owned suite

# Fast gate for everything this repository owns that can be verified without a
# site, database or Docker: static analysis, the Python test tree and the Node
# suites for the Desk front-end.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owned-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owned-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Install hash-pinned ruff into an isolated venv
        run: |
          set -euo pipefail
          python3 tools/foundation/annotated_step.py "Create lint venv" -- python3 -m venv .foundation/lint-venv
          printf '%s\n' 'ruff==0.16.8 --hash=sha256:15e7d226246961db9235098333caa13063906d3851136b84c2900b82f5daa1df' \
            > .foundation/lint-requirements.txt
          .foundation/lint-venv/bin/python -m pip install --quiet --no-deps \
            --require-hashes -r .foundation/lint-requirements.txt
          test "$(.foundation/lint-venv/bin/ruff --version)" = "ruff 0.16.8"

      - name: Install hash-pinned crypto test dependencies
        # The Office 365 signature regressions MUST execute in the owned suite,
        # not silently skip because the default runner lacks PyJWT/cryptography.
        run: |
          set -euo pipefail
          python3 tools/foundation/annotated_step.py "Create crypto test venv" -- python3 -m venv .foundation/security-test-venv
          .foundation/security-test-venv/bin/python -m pip install --quiet \
            --only-binary=:all: --require-hashes -r tests/security/requirements-ci.txt
          .foundation/security-test-venv/bin/python -m pip check
          echo "$GITHUB_WORKSPACE/.foundation/security-test-venv/bin" >> "$GITHUB_PATH"

      - name: Static analysis
        run: .foundation/lint-venv/bin/ruff check .

      - name: Python test tree
        run: |
          python3 tools/foundation/annotated_step.py "Crypto test imports" -- python3 -c 'import jwt, cryptography; assert jwt.__version__ == "2.15.0"'
          python3 tools/foundation/annotated_step.py "Python test tree" -- python3 -m unittest discover -s tests -t . -v

      - name: Node suites
        run: |
          node tests/foundation/test_realtime_guard.cjs
          node tests/foundation/test_command_pages.cjs
          node tests/foundation/test_design_system.cjs
          node tests/foundation/test_role_desks.cjs
