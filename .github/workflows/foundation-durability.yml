name: Foundation datastore durability

on:
  push:
    branches: [arena/01a0aafe-tofel-house-erp]
    paths:
      - .github/workflows/foundation-durability.yml
      - tools/foundation/runtime_durability.py
      - tests/foundation/test_durability_contract.py
      - docs/engineering/foundation-version-matrix.json
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: foundation-durability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  durability:
    if: github.ref == 'refs/heads/arena/01a0aafe-tofel-house-erp'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 reference resolved 2026-09-13
        with:
          persist-credentials: false
      - name: Test durability contract guards
        run: python3 -m unittest tests.foundation.test_durability_contract -q
      - name: Prove real MariaDB and Redis restart, crash and volume durability
        run: python3 tools/foundation/runtime_durability.py
      - name: Publish sanitized durability evidence
        if: always() && hashFiles('.foundation/durability-evidence/durability-result.json') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/foundation/publish_evidence.py .foundation/durability-evidence/durability-result.json --name 'Foundation datastore durability evidence'
      - name: Retain durability evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: foundation-durability-${{ github.run_id }}-${{ github.run_attempt }}
          path: .foundation/durability-evidence/
          if-no-files-found: error
          retention-days: 14
