name: Foundation operational boundaries

# Exercises the operational boundaries a real deployment is reached through, which
# the recovery and custody runs did not cover: both of those reached the application
# over plaintext HTTP on a loopback listener.
#
# The TLS edge job builds a live Frappe site, generates a private CA and a leaf
# certificate for the site hostname inside the run, and puts an nginx front proxy in
# front of it whose TLS policy is the pinned bench template's own - not one invented
# to be easy to pass. Two independent TLS clients then verify it: `openssl s_client`
# for the protocol-level facts, and Python's own `ssl` module so a result that depends
# on one client's quirks cannot pass unnoticed. Each refused protocol is checked to be
# refused by the *listener* rather than by the client's own OpenSSL policy, because
# only the first is evidence about the boundary.
#
# The tailnet half of the intended boundary is recorded as ENVIRONMENT-BLOCKED, not
# simulated. Joining a tailnet needs an owner-provisioned auth key and an ACL policy,
# and this session's GitHub credential cannot create repository secrets (HTTP 403, no
# admin permission). What is genuinely observable - which addresses the listeners are
# bound to, decoded from /proc/net/tcp rather than from a tool's summary - is reported,
# and nothing more.
#
# Rollback and monitoring/retention jobs follow in this same workflow. Neither upgrades
# a release gate: `production_authorization` stays REJECT until every release
# requirement is genuinely proven, and the dependency gate SEC-DEPS-01 is untouched.
on:
  push:
    branches: [arena/01a0b3a7-tofel-house-erp]
    paths:
      - .github/workflows/foundation-operational-boundaries.yml
      - tools/foundation/bench_bootstrap.py
      - tools/foundation/tls_edge.py
      - tools/foundation/runtime_tls_edge.py
      - tools/foundation/runtime_tls_edge_checks.py
      - tools/foundation/runtime_tls_edge_state.py
      - tools/foundation/runner_probe.py
      - tools/foundation/publish_evidence.py
      - tests/foundation/test_tls_edge_contract.py
      - docs/engineering/foundation-component-sources.json
      - docs/engineering/foundation-version-matrix.json
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: foundation-operational-boundaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tls-edge:
    if: github.ref == 'refs/heads/arena/01a0b3a7-tofel-house-erp'
    name: Operational boundaries - TLS edge
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Install pinned Yarn CLI
        run: npm install --global yarn@1.22.22
      - name: Establish fresh compatible Python and services
        run: python3 tools/foundation/runner_probe.py
      - name: Confirm OpenSSL can issue certificates and negotiate TLS 1.3
        run: |
          openssl version
          openssl ciphers -v | grep -c TLSv1.3
      - name: Test the TLS edge contract guards
        run: python3 -m unittest tests.foundation.test_tls_edge_contract -q
      - name: Issue certificates, start the TLS edge, and verify it as a real client
        run: python3 tools/foundation/runtime_tls_edge.py
      - name: Publish sanitized TLS edge evidence
        if: always() && hashFiles('.foundation/tls-edge-evidence/tls-edge-result.json') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/foundation/publish_evidence.py
          .foundation/tls-edge-evidence/tls-edge-result.json
          --name 'Foundation operational boundaries - TLS edge'
      - name: Retain TLS edge evidence, including failures
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: foundation-tls-edge-${{ github.run_id }}-${{ github.run_attempt }}
          path: .foundation/tls-edge-evidence/
          if-no-files-found: error
          retention-days: 14
