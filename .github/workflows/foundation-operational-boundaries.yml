name: Foundation operational boundaries

# Exercises the operational boundaries a real deployment is reached through, which
# the recovery and custody runs did not cover: both of those reached the application
# over plaintext HTTP on a loopback listener.
#
# The TLS edge job builds a live Frappe site, generates a private CA and a leaf
# certificate for the site hostname inside the run, and puts an nginx front proxy in
# front of it whose TLS policy is the pinned bench template's own - not one invented
# to be easy to pass. Two independent TLS clients then verify it: `openssl s_client`
# for the protocol-level facts, and Python's own `ssl` module so a result that depends
# on one client's quirks cannot pass unnoticed. Each refused protocol is checked to be
# refused by the *listener* rather than by the client's own OpenSSL policy, because
# only the first is evidence about the boundary.
#
# The tailnet half of the intended boundary is recorded as ENVIRONMENT-BLOCKED, not
# simulated. Joining a tailnet needs an owner-provisioned auth key and an ACL policy,
# and this session's GitHub credential cannot create repository secrets (HTTP 403, no
# admin permission). What is genuinely observable - which addresses the listeners are
# bound to, decoded from /proc/net/tcp rather than from a tool's summary - is reported,
# and nothing more.
#
# The rollback job makes the same site travel v16.33.0 -> the pinned current commit ->
# back to v16.33.0, restoring a backup whose digest was registered when it was taken.
# It has to distinguish a rollback from a claim about one, so code identity comes from
# the checked-out revision, artifact identity from a re-digest of the store the
# rollback deployed from, and data identity from unchanged `creation` timestamps -
# which is what separates preserved rows from rows that were deleted and re-created.
#
# The monitoring job writes an error through Frappe's own logging path and reads it
# back, compares the scheduler registry against the scheduler events the installed code
# actually declares, delivers an alert to a real SMTP sink holding a real socket, then
# removes that sink and requires the failure to be reported rather than swallowed, and
# exercises a backup retention limit set below the number of backups taken.
#
# None of this upgrades a release gate: `production_authorization` stays REJECT until
# every release requirement is genuinely proven, and the dependency gate SEC-DEPS-01 is
# untouched.
on:
  push:
    branches: [arena/01a0aafe-tofel-house-erp]
    paths:
      - .github/workflows/foundation-operational-boundaries.yml
      - tools/foundation/bench_bootstrap.py
      - tools/foundation/tls_edge.py
      - tools/foundation/runtime_tls_edge.py
      - tools/foundation/runtime_tls_edge_checks.py
      - tools/foundation/runtime_tls_edge_state.py
      - tools/foundation/operational_rollback.py
      - tools/foundation/runtime_rollback.py
      - tools/foundation/runtime_rollback_state.py
      - tools/foundation/monitoring_retention.py
      - tools/foundation/smtp_sink.py
      - tools/foundation/runtime_monitoring.py
      - tools/foundation/runtime_monitoring_mail.py
      - tools/foundation/runner_probe.py
      - tools/foundation/publish_evidence.py
      - tests/foundation/test_tls_edge_contract.py
      - tests/foundation/test_operational_rollback_contract.py
      - tests/foundation/test_monitoring_contract.py
      - docs/engineering/foundation-component-sources.json
      - docs/engineering/foundation-version-matrix.json
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: foundation-operational-boundaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tls-edge:
    if: github.ref == 'refs/heads/arena/01a0aafe-tofel-house-erp'
    name: Operational boundaries - TLS edge
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Install pinned Yarn CLI
        run: npm install --global yarn@1.22.22
      - name: Establish fresh compatible Python and services
        run: python3 tools/foundation/runner_probe.py
      - name: Confirm OpenSSL can issue certificates and negotiate TLS 1.3
        run: |
          openssl version
          openssl ciphers -v | grep -c TLSv1.3
      - name: Test the TLS edge contract guards
        run: python3 -m unittest tests.foundation.test_tls_edge_contract -q
      - name: Issue certificates, start the TLS edge, and verify it as a real client
        run: python3 tools/foundation/runtime_tls_edge.py
      - name: Publish sanitized TLS edge evidence
        if: always() && hashFiles('.foundation/tls-edge-evidence/tls-edge-result.json') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/foundation/publish_evidence.py
          .foundation/tls-edge-evidence/tls-edge-result.json
          --name 'Foundation operational boundaries - TLS edge'
      - name: Retain TLS edge evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: foundation-tls-edge-${{ github.run_id }}-${{ github.run_attempt }}
          path: .foundation/tls-edge-evidence/
          if-no-files-found: error
          retention-days: 14

  rollback:
    if: github.ref == 'refs/heads/arena/01a0aafe-tofel-house-erp'
    name: Operational boundaries - versioned rollback
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Install pinned Yarn CLI
        run: npm install --global yarn@1.22.22
      - name: Establish fresh compatible Python and services
        run: python3 tools/foundation/runner_probe.py
      - name: Test the rollback contract guards
        run: python3 -m unittest tests.foundation.test_operational_rollback_contract -q
      - name: Deploy v1, upgrade, then roll back from the registered artifact
        run: python3 tools/foundation/runtime_rollback.py
      - name: Publish sanitized rollback evidence
        if: always() && hashFiles('.foundation/rollback-evidence/rollback-result.json') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/foundation/publish_evidence.py
          .foundation/rollback-evidence/rollback-result.json
          --name 'Foundation operational boundaries - versioned rollback'
      - name: Retain rollback evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: foundation-rollback-${{ github.run_id }}-${{ github.run_attempt }}
          path: .foundation/rollback-evidence/
          if-no-files-found: error
          retention-days: 14

  monitoring:
    if: github.ref == 'refs/heads/arena/01a0aafe-tofel-house-erp'
    name: Operational boundaries - monitoring, alerts and retention
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Install pinned Yarn CLI
        run: npm install --global yarn@1.22.22
      - name: Establish fresh compatible Python and services
        run: python3 tools/foundation/runner_probe.py
      - name: Test the monitoring and retention contract guards
        run: python3 -m unittest tests.foundation.test_monitoring_contract -q
      - name: Exercise error logging, alert delivery to a real receiver, and retention
        run: python3 tools/foundation/runtime_monitoring.py
      - name: Publish sanitized monitoring evidence
        if: always() && hashFiles('.foundation/monitoring-evidence/monitoring-result.json') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/foundation/publish_evidence.py
          .foundation/monitoring-evidence/monitoring-result.json
          --name 'Foundation operational boundaries - monitoring, alerts and retention'
      - name: Retain monitoring evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: foundation-monitoring-${{ github.run_id }}-${{ github.run_attempt }}
          path: .foundation/monitoring-evidence/
          if-no-files-found: error
          retention-days: 14
